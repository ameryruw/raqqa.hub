<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>RAKKA HUB — دليل مدينة الرقّة</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 1.5 21.5 7v10L12 22.5 2.5 17V7z' fill='none' stroke='%23AF7F42' stroke-width='2'/><path d='M12 7l4.5 2.6v5.2L12 17.5l-4.5-2.7V9.6z' fill='%23AF7F42'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #18202f;
    --muted: #68748A;
    --card: #DCE1E6;
    --accent: #AF7F42;
    --accent2: #B8734F;
    --line: rgba(104,116,138,.35);
    --line-soft: rgba(104,116,138,.18);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  html[dir="rtl"] body{ font-family:'Noto Kufi Arabic','Golos Text',sans-serif; }
  html[dir="rtl"] *{ letter-spacing:normal !important; }
  body{
    background: var(--bg);
    color: var(--card);
    font-family: 'Golos Text','Noto Kufi Arabic',sans-serif;
    font-variant-numeric: tabular-nums;
    min-height: 100vh;
  }
  button{ font: inherit; touch-action: manipulation; }
  svg{ flex-shrink:0; }

  /* ============ Шапка ============ */
  .topbar{
    position: sticky; top:0; z-index:50;
    background: rgba(24,32,47,.94);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    display:flex; align-items:center; gap:16px;
    height:64px; padding:0 24px;
  }
  .brand{
    display:flex; align-items:center; gap:11px;
    font-weight:800; font-size:1.05rem; letter-spacing:.12em; color:var(--card);
    text-decoration:none; white-space:nowrap;
  }
  .brand svg{ color: var(--accent); }
  .brand-sub{
    font-family:'Noto Kufi Arabic',sans-serif;
    font-weight:400; font-size:.8rem; color:var(--muted);
    letter-spacing:0; align-self:flex-end; padding-bottom:2px;
  }
  html[dir="rtl"] .brand{ font-family:'Golos Text',sans-serif; }
  .lang-switch{
    margin-inline-start:auto;
    display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden;
  }
  .lang-switch button{
    background:none; border:none; cursor:pointer;
    color:var(--muted); font-weight:700; font-size:.78rem;
    padding:8px 15px; transition: background .2s, color .2s;
  }
  .lang-switch button.on{ background: var(--accent); color: var(--bg); }
  .btn-admin{
    display:inline-flex; align-items:center; gap:8px;
    background:none; border:1px solid var(--accent); color:var(--accent);
    border-radius:9px; padding:8px 15px; font-size:.82rem; font-weight:600;
    cursor:pointer; transition: background .2s;
    white-space:nowrap; touch-action: manipulation;
  }
  .btn-admin:hover{ background: rgba(175,127,66,.16); }
  .btn-admin:active{ transform: scale(.97); }

  /* ============ Hero ============ */
  .hero{ max-width: 980px; margin:0 auto; padding: 62px 24px 26px; }
  .hero-meta{
    color:var(--muted); font-size:.72rem; font-weight:600;
    letter-spacing:.28em; text-transform:uppercase;
    display:flex; align-items:center; gap:14px;
  }
  .hero-meta::after{ content:""; flex:1; height:1px; background:var(--line); }
  .hero h1{
    font-size: clamp(2.1rem, 5vw, 3.4rem);
    font-weight:800; line-height:1.08; margin:14px 0 4px;
  }
  .hero h1 em{ font-style:normal; color:var(--accent); }
  .hero-alt{
    color:var(--muted); font-size:1.05rem; font-weight:600;
    border-inline-start:3px solid var(--accent);
    padding-inline-start:12px; margin-top:6px;
  }
  html[dir="ltr"] .hero-alt{ font-family:'Noto Kufi Arabic',sans-serif; }
  .hero-desc{
    color:var(--card); opacity:.72; max-width:560px;
    margin-top:18px; line-height:1.65; font-size:.98rem;
  }
  .search{
    display:flex; align-items:center; gap:11px;
    max-width:560px; margin-top:26px;
    border:1px solid var(--line); border-radius:12px;
    padding:13px 16px; background: rgba(220,225,230,.05);
    transition:border-color .2s;
  }
  .search:focus-within{ border-color: var(--accent); }
  .search svg{ color: var(--muted); }
  .search input{
    flex:1; background:none; border:none; outline:none;
    color:var(--card); font:inherit; font-size:.98rem;
  }
  .search input::placeholder{ color:var(--muted); }

  /* ============ Категории ============ */
  .cats{
    max-width:980px; margin:30px auto 0; padding:0 24px;
    display:flex; gap:9px; overflow-x:auto;
    scrollbar-width:thin; scrollbar-color:var(--muted) transparent;
    touch-action: pan-x manipulation;
  }
  .cat-pill{
    flex-shrink:0; display:inline-flex; align-items:baseline; gap:9px;
    border:1px solid var(--line); border-radius:999px;
    background:none; color:var(--card);
    padding:9px 17px; font-size:.88rem; font-weight:600; cursor:pointer;
    transition: background .2s, border-color .2s, color .2s;
    white-space:nowrap; touch-action: manipulation;
  }
  .cat-pill .cnt{ font-size:.72rem; color:var(--muted); font-weight:500; }
  .cat-pill:hover{ border-color: var(--accent); }
  .cat-pill.on{ background: var(--accent); border-color:var(--accent); color:var(--bg); }
  .cat-pill.on .cnt{ color:var(--bg); opacity:.65; }
  .cat-pill:active{ transform: scale(.97); }

  /* ============ Подкатегории ============ */
  .subs{
    max-width:980px; margin:14px auto 0; padding:0 24px;
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  }
  .chip{
    background:none; border:1px solid var(--line); color:var(--card);
    border-radius:999px; padding:6px 13px;
    font-size:.8rem; font-weight:500; cursor:pointer;
    transition: border-color .2s, color .2s, background .2s;
    touch-action: manipulation;
  }
  .chip:hover{ border-color:var(--accent); }
  .chip.on{ border-color:var(--accent); color:var(--accent); background:rgba(175,127,66,.14); font-weight:700; }
  .chip:active{ transform: scale(.96); }
  .btn-add{
    margin-inline-start:auto;
    display:inline-flex; align-items:center; gap:7px;
    background:var(--accent); color:var(--bg); border:none;
    border-radius:9px; padding:9px 16px;
    font-size:.85rem; font-weight:700; cursor:pointer;
    transition: filter .2s;
    touch-action: manipulation;
  }
  .btn-add:hover{ filter: brightness(1.12); }
  .btn-add:active{ transform: scale(.97); }
  .btn-add.hidden{ display:none; }

  /* ============ Список ============ */
  .list-wrap{ max-width:980px; margin:38px auto 90px; padding:0 24px; }
  .list-head{
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
    padding-bottom:14px; border-bottom:2px solid var(--accent);
  }
  .list-head h2{ font-size: clamp(1.4rem, 3vw, 1.9rem); font-weight:800; }
  .list-head .cnt{ color:var(--muted); font-size:.85rem; font-weight:600; }
  .conn{
    margin-inline-start:auto;
    display:inline-flex; align-items:center; gap:7px;
    font-size:.68rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted);
  }
  html[dir="rtl"] .conn{ text-transform:none; letter-spacing:0; }
  .conn .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--muted); flex-shrink:0;
    transition: background .3s;
  }
  .conn.online .dot{ background: var(--accent); animation: pulse 2.2s infinite; }
  .conn.cache  .dot{ background: var(--accent2); }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(175,127,66,.55); }
    50%{ box-shadow:0 0 0 5px rgba(175,127,66,0); }
  }
  .sheet{
    background:var(--card); color:var(--bg);
    border-radius:16px; overflow:hidden; margin-top:6px;
  }
  .row{
    display:grid;
    grid-template-columns: 60px minmax(0,1fr) auto;
    gap: 8px 22px;
    padding: 25px 22px;
    border-bottom: 1px solid var(--line-soft);
    position:relative;
    animation: fadeUp .45s both;
  }
  .row:last-child{ border-bottom:none; }
  .row::before{
    content:""; position:absolute; inset-inline-start:0; top:0; bottom:0;
    width:3px; background:var(--accent); opacity:0; transition:opacity .2s;
  }
  .row:hover{ background: rgba(175,127,66,.09); }
  .row:hover::before{ opacity:1; }
  .num{
    font-weight:800; font-size:1.35rem;
    color:var(--accent); opacity:.85; padding-top:2px;
  }
  .row-body{ min-width:0; }
  .row-top{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .row-top h3{ font-size:1.12rem; font-weight:700; line-height:1.3; }
  .tag{
    background: rgba(175,127,66,.2); color: var(--bg);
    font-size:.68rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    padding:4px 9px; border-radius:5px; white-space:nowrap;
  }
  html[dir="rtl"] .tag{ text-transform:none; letter-spacing:0; }
  .row-desc{
    color:var(--muted); font-size:.9rem; line-height:1.55; margin-top:8px;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .row-meta{ display:flex; flex-wrap:wrap; gap:7px 24px; margin-top:12px; font-size:.9rem; }
  .row-meta span{ display:inline-flex; align-items:center; gap:7px; }
  .row-meta svg{ color: var(--accent); }
  .row-meta .loc{ color:var(--muted); }
  .row-actions{
    display:flex; flex-direction:column; gap:9px; justify-content:center; align-items:stretch;
  }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    border-radius:9px; padding:9px 15px;
    font-size:.83rem; font-weight:700; cursor:pointer;
    text-decoration:none; border:1px solid transparent;
    transition: filter .2s, background .2s;
    touch-action: manipulation;
  }
  .btn:active{ transform: scale(.97); }
  .btn-solid{ background:var(--accent); color:var(--bg); }
  .btn-solid:hover{ filter:brightness(1.12); }
  .btn-outline{ border-color:var(--accent); color:var(--bg); }
  .btn-outline:hover{ background:rgba(175,127,66,.15); }
  .btn-danger{ border-color:var(--accent2); color:var(--accent2); }
  .btn-danger:hover{ background:rgba(184,115,79,.14); }
  .empty{ padding:64px 24px; text-align:center; color:var(--muted); }
  .empty svg{ opacity:.5; margin-bottom:14px; }
  .empty h4{ color:var(--bg); font-weight:700; margin-bottom:6px; font-size:1.05rem; }
  .empty p{ font-size:.9rem; max-width:340px; margin:0 auto; line-height:1.6; }

  /* ============ Футер ============ */
  footer{
    border-top:1px solid var(--line);
    padding:26px 24px 90px; text-align:center;
    color:var(--muted); font-size:.8rem;
  }

  /* ============ Плавающая кнопка выхода ============ */
  .float-logout{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
    z-index:60; display:none;
    align-items:center; gap:9px;
    background:var(--accent2); color:var(--bg);
    border:none; border-radius:999px;
    padding:13px 22px; font-weight:700; font-size:.9rem; cursor:pointer;
    box-shadow:0 12px 32px rgba(0,0,0,.45);
    transition: filter .2s;
    touch-action: manipulation;
  }
  .float-logout:hover{ filter:brightness(1.1); }
  .float-logout:active{ transform: translateX(-50%) scale(.96); }
  .float-logout.show{ display:inline-flex; animation: fadeUp .35s both; }

  /* ============ Тосты ============ */
  #toastWrap{
    position:fixed; top:78px; left:50%; transform:translateX(-50%);
    z-index:10050;
    display:flex; flex-direction:column; gap:9px; align-items:center;
    pointer-events:none; width:min(92vw, 480px);
  }
  .toast{
    background:var(--card); color:var(--bg);
    border-inline-start:4px solid var(--accent);
    border-radius:10px; padding:13px 20px;
    font-size:.9rem; font-weight:600;
    box-shadow:0 14px 34px rgba(0,0,0,.4);
    animation: fadeUp .3s both; max-width:100%;
    word-break: break-word;
  }
  .toast.err{ border-inline-start-color: var(--accent2); }
  .toast.out{ opacity:0; transform:translateY(-8px); transition:opacity .3s, transform .3s; }

  /* ============ Модальные окна ============ */
  .overlay{
    position:fixed; inset:0;
    z-index:9999;
    background:rgba(24,32,47,.55);
    backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
    display:flex; align-items:center; justify-content:center;
    padding:20px; opacity:0; pointer-events:none;
    transition: opacity .28s;
    touch-action: manipulation;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .modal{
    background:var(--card); color:var(--bg);
    width:100%; max-width:460px; max-height:90vh; overflow-y:auto;
    border-radius:16px; padding:30px 28px;
    transform: translateY(16px) scale(.97);
    transition: transform .28s;
    touch-action: manipulation;
    -webkit-overflow-scrolling: touch;
  }
  .overlay.show .modal{ transform:none; }
  .modal-head{ display:flex; align-items:flex-start; gap:14px; margin-bottom:8px; }
  .modal-head h3{ font-size:1.3rem; font-weight:800; flex:1; }
  .modal-close{
    background:none; border:none; color:var(--muted); cursor:pointer;
    padding:9px; border-radius:9px; display:flex;
    touch-action: manipulation;
  }
  .modal-close:hover{ color:var(--accent2); background:rgba(104,116,138,.15); }
  .modal-close:active{ transform: scale(.92); }
  .modal-desc{ color:var(--muted); font-size:.9rem; line-height:1.55; margin-bottom:22px; }

  .field{ margin-bottom:17px; }
  .field label{
    display:block; font-size:.72rem; font-weight:700;
    letter-spacing:.07em; text-transform:uppercase;
    color:var(--muted); margin-bottom:7px;
  }
  html[dir="rtl"] .field label{ text-transform:none; }
  .field label .req{ color: var(--accent2); }
  .field input, .field select, .field textarea{
    width:100%;
    background: var(--bg); color: var(--card);
    border:1px solid transparent; border-radius:10px;
    padding:12px 14px; font:inherit; font-size:16px;
    outline:none; transition: border-color .2s;
    touch-action: manipulation;
  }
  .field textarea{ resize:vertical; min-height:96px; line-height:1.55; }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color: var(--accent); }
  .field input::placeholder, .field textarea::placeholder{ color:var(--muted); }
  .field select{ appearance:none; cursor:pointer; }
  .counter{ text-align:end; font-size:.72rem; color:var(--muted); margin-top:5px; }
  .counter.over{ color:var(--accent2); font-weight:700; }
  .modal-actions{ display:flex; gap:11px; margin-top:24px; }
  .modal-actions .btn{ flex:1; padding:13px; font-size:.92rem; }

  .modal-submit{
    width:100%; margin-top:4px; padding:15px; font-size:1rem !important;
    touch-action: manipulation;
    min-height:52px;
  }
  .modal-submit:active{ transform: scale(.98); filter:brightness(1.15); }
  .modal-submit[disabled]{ opacity:.55; pointer-events:none; }

  .err-banner{
    display:none;
    background: var(--accent2); color: var(--card);
    border-radius:10px; padding:12px 16px;
    font-size:.88rem; font-weight:700;
    margin-bottom:18px; text-align:center;
    word-break: break-word;
  }
  .err-banner.show{ display:block; animation: fadeUp .3s both; }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(12px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ============ Адаптив ============ */
  @media (max-width: 760px){
    .topbar{ padding:0 14px; gap:10px; }
    .btn-admin .t{ display:none; }
    .hero{ padding:44px 16px 20px; }
    .cats, .subs, .list-wrap{ padding-inline:16px; }
    .row{ grid-template-columns: minmax(0,1fr); gap:12px; padding:21px 16px; }
    .num{ display:none; }
    .row-actions{ flex-direction:row; flex-wrap:wrap; }
    .btn-add{ margin-inline-start:0; width:100%; justify-content:center; }
    .modal{ padding:24px 20px; }
    .overlay{ padding:14px; align-items:center; }
    .conn{ margin-inline-start:0; width:100%; }
  }
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="#">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
      <path d="M12 1.5 21.5 7v10L12 22.5 2.5 17V7L12 1.5z" stroke="#AF7F42" stroke-width="1.7"/>
      <path d="M12 6.6 16.9 9.4v5.4L12 17.7 7.1 14.8V9.4L12 6.6z" fill="#AF7F42"/>
    </svg>
    RAKKA HUB<span class="brand-sub">الرقّة</span>
  </a>
  <div class="lang-switch" role="group" aria-label="Language">
    <button id="langRu" class="on" type="button">RU</button>
    <button id="langAr" type="button">ع</button>
  </div>
  <button class="btn-admin" id="adminBtn" type="button">
    <span class="ic"></span><span class="t" data-i18n="adminBtn"></span>
  </button>
</header>

<section class="hero">
  <div class="hero-meta">35.95° N · 39.02° E</div>
  <h1 data-i18n-html="heroTitle"></h1>
  <div class="hero-alt" id="heroAlt"></div>
  <p class="hero-desc" data-i18n="heroDesc"></p>
  <div class="search">
    <span id="searchIcon"></span>
    <input id="searchInput" type="search" inputmode="search" data-i18n-ph="searchPh">
  </div>
</section>

<nav class="cats" id="cats" aria-label="Категории"></nav>
<div class="subs" id="subs"></div>

<main class="list-wrap">
  <div class="list-head">
    <h2 id="listTitle"></h2>
    <span class="cnt" id="listCount"></span>
    <span class="conn" id="connState"><span class="dot"></span><span id="connText"></span></span>
  </div>
  <div class="sheet">
    <div id="list"></div>
    <div id="empty" class="empty" hidden>
      <div id="emptyIcon"></div>
      <h4 data-i18n="emptyTitle"></h4>
      <p data-i18n="emptyDesc"></p>
    </div>
  </div>
</main>

<footer data-i18n="footer"></footer>

<button class="float-logout" id="floatLogout" type="button">
  <span id="logoutIcon"></span><span data-i18n="logoutFloat"></span>
</button>

<div id="toastWrap"></div>

<!-- Модальное окно: вход администратора -->
<div class="overlay" id="loginOverlay" role="dialog" aria-modal="true">
  <form class="modal" id="loginForm" novalidate>
    <div class="modal-head">
      <h3 data-i18n="loginTitle"></h3>
      <button class="modal-close" type="button" data-close="loginOverlay" aria-label="Close"></button>
    </div>
    <p class="modal-desc" data-i18n="loginDesc"></p>
    <div class="err-banner" id="loginErr" role="alert"></div>
    <div class="field">
      <label for="emailInput" data-i18n="email"></label>
      <input type="email" id="emailInput" autocomplete="username"
             autocapitalize="none" autocorrect="off" spellcheck="false"
             inputmode="email" enterkeyhint="next">
    </div>
    <div class="field">
      <label for="passInput" data-i18n="password"></label>
      <input type="password" id="passInput" autocomplete="current-password" enterkeyhint="go">
    </div>
    <button class="btn btn-solid modal-submit" type="button" id="loginSubmitBtn" data-i18n="login"></button>
  </form>
</div>

<!-- Модальное окно: добавление карточки -->
<div class="overlay" id="addOverlay" role="dialog" aria-modal="true">
  <form class="modal" id="addForm" novalidate>
    <div class="modal-head">
      <h3 data-i18n="addTitle"></h3>
      <button class="modal-close" type="button" data-close="addOverlay" aria-label="Close"></button>
    </div>
    <div class="err-banner" id="addErr" role="alert"></div>
    <div class="field">
      <label data-i18n="fCategory"></label>
      <select id="fCat"></select>
    </div>
    <div class="field">
      <label data-i18n="fSub"></label>
      <select id="fSub"></select>
    </div>
    <div class="field">
      <label data-i18n="fTitle"></label>
      <input type="text" id="fTitle" autocapitalize="words">
    </div>
    <div class="field">
      <label data-i18n="fPhone"></label>
      <input type="tel" id="fPhone" inputmode="tel" placeholder="+963 9XX XXX XXX">
    </div>
    <div class="field">
      <label id="fLocLabel" data-i18n="fLocation"></label>
      <input type="text" id="fLoc">
    </div>
    <div class="field">
      <label data-i18n="fDesc"></label>
      <textarea id="fDesc" maxlength="500"></textarea>
      <div class="counter" id="descCounter">0 / 500</div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" type="button" data-close="addOverlay" data-i18n="cancel"></button>
      <button class="btn btn-solid" type="submit" data-i18n="save"></button>
    </div>
  </form>
</div>

<!-- Модальное окно: подтверждение удаления -->
<div class="overlay" id="confirmOverlay" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-head">
      <h3 data-i18n="confirmTitle"></h3>
      <button class="modal-close" type="button" data-close="confirmOverlay" aria-label="Close"></button>
    </div>

    // Без серверного orderBy("createdAt") — такой запрос молча выбрасывает

    state.docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    state.docs.sort((a, b) => {
      const sa = (a.createdAt && a.createdAt.seconds) || 0;
      const sb = (b.createdAt && b.createdAt.seconds) || 0;
      return sb - sa;
    });
    renderAll();
    setConn(snap.metadata.fromCache ? "cache" : "online");

    html += `<button type="button" id="addCardBtn" class="btn-add${state.admin ? "" : " hidden"}">
      ${icon("plus", 15)}<span>${esc(t("addCard"))}</span></button>`;
    el.innerHTML = `<button type="button" class="chip${state.sub === "all" ? " on" : ""}" data-sub="all">${esc(t("all"))}</button>` + html;
  }

  function filtered() {
    let items = state.docs.filter(d => d.group === state.cat);
    if (state.sub !== "all") items = items.filter(d => d.subcategory === state.sub);
    if (state.search) {
      const s = state.search.toLowerCase().replace(/\s/g, "");
      items = items.filter(d =>
        (d.title || "").toLowerCase().includes(state.search.toLowerCase()) ||
        (d.description || "").toLowerCase().includes(state.search.toLowerCase()) ||
        (d.phone || "").replace(/\s/g, "").includes(s)
      );
    }
    return items;
  }

  function renderList() {
    const cat = catById(state.cat);
    const items = filtered();
    $("listTitle").textContent = catName(cat) + (state.sub !== "all" ? " · " + subName(state.cat, state.sub) : "");
    $("listCount").textContent = `${t("found")}: ${items.length}`;

    const listEl = $("list");
    listEl.innerHTML = items.map((p, i) => {
      const tel = (p.phone || "").replace(/[^\d+]/g, "");
      const wa = tel.replace(/\D/g, "");
      return `
      <article class="row" style="animation-delay:${Math.min(i * 45, 400)}ms">
        <div class="num">${String(i + 1).padStart(2, "0")}</div>
        <div class="row-body">
          <div class="row-top">
            <h3>${esc(p.title)}</h3>
            <span class="tag">${esc(subName(p.group, p.subcategory))}</span>
          </div>
          ${p.description ? `<p class="row-desc">${esc(p.description)}</p>` : ""}
          <div class="row-meta">
            ${p.phone ? `<span>${icon("phone", 15)}${esc(p.phone)}</span>` : ""}
            ${p.location ? `<span class="loc">${icon("pin", 15)}${esc(p.location)}</span>` : ""}
          </div>
        </div>
        <div class="row-actions">
          ${p.phone ? `<a class="btn btn-solid" href="tel:${esc(tel)}">${icon("phone", 14)}${esc(t("call"))}</a>` : ""}
          ${wa ? `<a class="btn btn-outline" href="https://wa.me/${esc(wa)}" target="_blank" rel="noopener">${icon("chat", 14)}WhatsApp</a>` : ""}
          ${state.admin ? `<button type="button" class="btn btn-danger row-del" data-id="${esc(p.id)}">${icon("trash", 14)}${esc(t("delete"))}</button>` : ""}
        </div>
      </article>`;
    }).join("");
    $("empty").hidden = items.length > 0;
    $("emptyIcon").innerHTML = icon("inbox", 42);
  }

  function renderAll() { renderCats(); renderSubs(); renderList(); }

  function applyLang() {
    const L = state.lang;
    document.documentElement.lang = L;
    document.documentElement.dir = (L === "ar") ? "rtl" : "ltr";
    $("langRu").classList.toggle("on", L === "ru");
    $("langAr").classList.toggle("on", L === "ar");
    document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
    document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
    document.querySelectorAll("[data-i18n-html]").forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
    $("heroAlt").textContent = t("heroTag");
    setConn($("connState").classList.contains("cache") ? "cache" : "online");
    renderAll();
  }

  /* ================= Модальные окна ================= */
  const openOv = (id) => $(id).classList.add("show");
  const closeOv = (id) => $(id).classList.remove("show");
  document.querySelectorAll("[data-close]").forEach(b =>
    b.addEventListener("click", () => closeOv(b.dataset.close)));
  ["loginOverlay", "addOverlay", "confirmOverlay"].forEach(id => {
    $(id).addEventListener("click", e => { if (e.target === $(id)) closeOv(id); });
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") ["loginOverlay", "addOverlay", "confirmOverlay"].forEach(id => closeOv(id));
  });

  /* ================= Авторизация ================= */
  function syncAdminUI() {
    $("adminBtn").style.display = state.admin ? "none" : "";
    $("floatLogout").classList.toggle("show", state.admin);
    renderSubs();
    renderList();
  }

  onAuthStateChanged(auth, user => {
    state.admin = !!user;
    syncAdminUI();
  });

  $("adminBtn").addEventListener("click", () => {
    $("loginErr").classList.remove("show");
    $("loginForm").reset();
    openOv("loginOverlay");
    setTimeout(() => { try { $("emailInput").focus(); } catch {} }, 350);
  });

  let loginBusy = false;
  async function doLogin() {
    if (loginBusy) return;
    const em = $("emailInput").value.trim();
    const pw = $("passInput").value.trim();
    if (!em || !pw) { banner($("loginErr"), "fillRequired"); return; }

    const btn = $("loginSubmitBtn");
    loginBusy = true;
    btn.disabled = true;
    btn.textContent = t("loginBusy");

    try {
      await withTimeout(signInWithEmailAndPassword(auth, em, pw), 15000);
      state.admin = true;
      syncAdminUI();
      closeOv("loginOverlay");
      toast(t("toastWelcome"));
    } catch (err) {
      console.error("Auth error:", err && err.code, err && err.message);
      bannerMsg($("loginErr"), authErrText(err && err.code));
    } finally {
      loginBusy = false;
      btn.disabled = false;
      btn.textContent = t("login");
    }
  }

  $("loginSubmitBtn").addEventListener("click", doLogin);
  $("loginForm").addEventListener("submit", e => { e.preventDefault(); doLogin(); });
  $("passInput").addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); doLogin(); }
  });
  $("emailInput").addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); $("passInput").focus(); }
  });

  $("floatLogout").addEventListener("click", async () => {
    try {
      await signOut(auth);
      toast(t("toastLoggedOut"));
    } catch (e) {
      console.error(e);
    }
  });

  /* ================= Форма добавления карточки ================= */
  function fillCatSelect() {
    $("fCat").innerHTML = CATS.map(c =>
      `<option value="${c.id}"${state.cat === c.id ? " selected" : ""}>${esc(catName(c))}</option>`).join("");
    fillSubSelect();
  }
  function fillSubSelect() {
    const cat = catById($("fCat").value);
    $("fSub").innerHTML = cat.subs.map(s =>
      `<option value="${s.id}">${esc(s[state.lang === "ar" ? "ar" : "ru"])}</option>`).join("");
    updateLocLabel();
  }
  function updateLocLabel() {
    const isStore = $("fCat").value === "stores";
    $("fLocLabel").innerHTML = esc(t("fLocation")) + (isStore ? ' <span class="req">*</span>' : "");
    $("fTitle").placeholder = t(isStore ? "fTitleStore" : "fTitlePerson");
  }
  $("fCat").addEventListener("change", fillSubSelect);

  $("fDesc").addEventListener("input", () => {
    const n = $("fDesc").value.length;
    const c = $("descCounter");
    c.textContent = `${n} / 500`;
    c.classList.toggle("over", n > 500);
  });

  function openAddModal() {
    $("addForm").reset();
    $("addErr").classList.remove("show");
    $("descCounter").textContent = "0 / 500";
    $("descCounter").classList.remove("over");
    fillCatSelect();
    openOv("addOverlay");
  }

  $("addForm").addEventListener("submit", async e => {
    e.preventDefault();
    const groupId = $("fCat").value;
    const cat = catById(groupId);
    const title = $("fTitle").value.trim();
    const phone = $("fPhone").value.trim();
    const location = $("fLoc").value.trim();
    const description = $("fDesc").value.trim();

    if (!title || !phone || !groupId) { banner($("addErr"), "fillRequired"); return; }
    if (cat.base === "stores" && !location) { banner($("addErr"), "locRequired"); return; }
    if (description.length > 500) { banner($("addErr"), "descLimit"); return; }

    try {
      await dbAdd({
        type: cat.base === "stores" ? "store" : "person",
        category: cat.base,
        group: groupId,
        subcategory: $("fSub").value,
        title, phone, location, description
      });
      closeOv("addOverlay");
      toast(t("toastAdded"));
    } catch (err) {
      console.error(err);
      toast("⚠ " + ((err && err.code) || t("loadError")), "err");
    }
  });

  /* ================= Удаление ================= */
  $("list").addEventListener("click", e => {
    const btn = e.target.closest(".row-del");
    if (!btn) return;
    pendingDeleteId = btn.dataset.id;
    const p = state.docs.find(d => d.id === pendingDeleteId);
    $("confirmText").textContent = t("confirmDesc").replace("{title}", p ? p.title : "");
    openOv("confirmOverlay");
  });

  $("confirmDeleteBtn").addEventListener("click", async () => {
    if (!pendingDeleteId) return;
    try {
      await dbRemove(pendingDeleteId);
      toast(t("toastDeleted"));
    } catch (err) {
      console.error(err);
      toast("⚠ " + ((err && err.code) || t("loadError")), "err");
    }
    pendingDeleteId = null;
    closeOv("confirmOverlay");
  });

  /* ================= Навигация, поиск, язык ================= */
  $("cats").addEventListener("click", e => {
    const b = e.target.closest(".cat-pill");
    if (!b) return;
    state.cat = b.dataset.cat;
    state.sub = "all";
    renderCats(); renderSubs(); renderList();
  });

  $("subs").addEventListener("click", e => {
    const chip = e.target.closest(".chip");
    if (chip) { state.sub = chip.dataset.sub; renderSubs(); renderList(); return; }
    if (e.target.closest("#addCardBtn")) openAddModal();
  });

  $("searchInput").addEventListener("input", e => {
    state.search = e.target.value.trim();
    renderList();
  });

  $("langRu").addEventListener("click", () => setLang("ru"));
  $("langAr").addEventListener("click", () => setLang("ar"));
  function setLang(l) {
    if (state.lang === l) return;
    state.lang = l;
    store.set("rakka_lang", l);
    applyLang();
  }

  /* ================= Инициализация ================= */
  (async function init() {
    try {
      $("adminBtn").querySelector(".ic").innerHTML = icon("lock", 15);
      $("searchIcon").innerHTML = icon("search", 18);
      $("logoutIcon").innerHTML = icon("logout", 16);
      document.querySelectorAll(".modal-close").forEach(b => b.innerHTML = icon("x", 18));

      applyLang();
      renderAll();
      startListener();
    } catch (e) {
      console.error(e);
      toast("⚠ " + (e.message || "Ошибка инициализации"), "err");
    }
  })();
</script>
</body>
</html>
