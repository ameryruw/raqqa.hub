<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>دليلك في الرقة — RAKKA HUB</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 1.5 21.5 7v10L12 22.5 2.5 17V7z' fill='none' stroke='%23AF7F42' stroke-width='2'/><path d='M12 7l4.5 2.6v5.2L12 17.5l-4.5-2.7V9.6z' fill='%23AF7F42'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #18202f;
    --muted: #68748A;
    --card: #DCE1E6;
    --accent: #AF7F42;
    --accent2: #B8734F;
    --accent-hi: #C2924F;
    --accent-lo: #7D5F33;
    --line: rgba(104,116,138,.35);
    --line-soft: rgba(104,116,138,.18);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; overflow-x:hidden; }
  html[dir="rtl"] body{ font-family:'Noto Kufi Arabic','Golos Text',sans-serif; }
  html[dir="rtl"] *{ letter-spacing:normal !important; }
  body{
    background: var(--bg);
    color: var(--card);
    font-family: 'Golos Text','Noto Kufi Arabic',sans-serif;
    font-variant-numeric: tabular-nums;
    min-height: 100vh;
    overflow-x: hidden;
    width: 100%;
  }
  button{ font: inherit; touch-action: manipulation; }
  svg{ flex-shrink:0; }
  h1, h2, h3, p, span, button, .tag, .chip{ overflow-wrap: break-word; }
  .hero, .cats, .subs, .list-wrap, footer{ position:relative; }

  /* Телефон и числа в RTL: всегда слева направо */
  html[dir="rtl"] .ltr-num{ direction:ltr; unicode-bidi:isolate; display:inline-flex; align-items:center; gap:7px; }
  html[dir="rtl"] .ltr-num > span{ direction:ltr; unicode-bidi:isolate; }
  html[dir="rtl"] .rating-num{ direction:ltr; unicode-bidi:isolate; }
  html[dir="rtl"] .rating-cnt{ unicode-bidi:plaintext; }

  /* ============ Фон ============ */
  .bg-deco{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .moon{
    position:absolute; top:78px; inset-inline-end:5%;
    width:160px; height:160px; border-radius:50%;
    background: radial-gradient(circle at 36% 30%, #F0D5A8, var(--accent) 66%);
    box-shadow: 0 0 70px 18px rgba(175,127,66,.34),
                0 0 190px 70px rgba(175,127,66,.14),
                inset -12px -16px 36px rgba(125,95,51,.5);
    animation: floaty 9s ease-in-out infinite;
    will-change: transform;
  }
  .moon::after{
    content:""; position:absolute; top:-18px; inset-inline-start:-34px;
    width:150px; height:150px; border-radius:50%;
    background: var(--bg);
  }
  .ring{
    position:absolute; border-radius:50%;
    border:1px dashed rgba(175,127,66,.16);
    animation: spin 70s linear infinite;
  }
  .r1{ bottom:-220px; inset-inline-start:-170px; width:520px; height:520px; }
  .r2{ bottom:-120px; inset-inline-start:-70px; width:300px; height:300px;
       border-color: rgba(104,116,138,.14); animation-duration:52s; animation-direction:reverse; }
  .spark{
    position:absolute; border-radius:50%;
    background: var(--accent);
    box-shadow: 0 0 10px 2px rgba(175,127,66,.55);
    animation: drift 16s linear infinite;
  }
  .s1{ width:5px; height:5px; top:24%; inset-inline-start:10%; }
  .s2{ width:3px; height:3px; top:46%; inset-inline-start:22%; animation-duration:21s; animation-delay:-6s; }
  .s3{ width:4px; height:4px; top:64%; inset-inline-start:8%;  animation-duration:13s; animation-delay:-3s; }
  .s4{ width:3px; height:3px; top:14%; inset-inline-start:42%; animation-duration:18s; animation-delay:-9s; }
  .s5{ width:5px; height:5px; top:78%; inset-inline-start:36%; animation-duration:15s; animation-delay:-5s; }
  .s6{ width:3px; height:3px; top:34%; inset-inline-start:64%; animation-duration:19s; animation-delay:-12s; opacity:.4; }
  @keyframes floaty{ 0%,100%{ margin-top:0; } 50%{ margin-top:-16px; } }
  @keyframes drift{
    0%{ transform:translate(0,0); opacity:0; }
    12%{ opacity:.65; } 85%{ opacity:.3; }
    100%{ transform:translate(46px,-130px); opacity:0; }
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ============ 3D-куб ============ */
  .cube-stage{
    width:54px; height:54px;
    perspective: 340px;
    display:inline-flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .cube{
    position:relative; width:54px; height:54px;
    transform-style: preserve-3d;
    animation: cubeSpin 14s linear infinite;
  }
  @keyframes cubeSpin{
    from{ transform: rotateX(-18deg) rotateY(0deg); }
    to  { transform: rotateX(-18deg) rotateY(360deg); }
  }
  .cube .face{
    position:absolute; inset:0;
    border:1.5px solid var(--accent);
    border-radius:9px;
    background: rgba(175,127,66,.13);
    box-shadow: inset 0 0 18px rgba(175,127,66,.28);
  }
  .cube .f1{ transform: translateZ(27px); }
  .cube .f2{ transform: rotateY(180deg) translateZ(27px); }
  .cube .f3{ transform: rotateY(90deg)  translateZ(27px); }
  .cube .f4{ transform: rotateY(-90deg) translateZ(27px); }
  .cube .f5{ transform: rotateX(90deg)  translateZ(27px); }
  .cube .f6{ transform: rotateX(-90deg) translateZ(27px); }

  /* ============ Шапка ============ */
  .topbar{
    position: sticky; top:0; z-index:50;
    background: rgba(24,32,47,.94);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    display:flex; align-items:center; gap:12px;
    height:64px; padding:0 24px;
  }
  .brand{
    display:flex; align-items:center; gap:11px;
    font-weight:800; font-size:1.05rem; letter-spacing:.12em; color:var(--card);
    text-decoration:none; white-space:nowrap;
    text-shadow: 0 2px 12px rgba(0,0,0,.5);
    min-width:0;
  }
  .brand svg{ color: var(--accent); filter: drop-shadow(0 2px 6px rgba(175,127,66,.5)); }
  .brand-sub{
    font-family:'Noto Kufi Arabic',sans-serif;
    font-weight:400; font-size:.8rem; color:var(--muted);
    letter-spacing:0; align-self:flex-end; padding-bottom:2px;
  }
  html[dir="rtl"] .brand{ font-family:'Golos Text',sans-serif; }
  .lang-switch{
    margin-inline-start:auto;
    display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden;
    flex-shrink:0;
  }
  .lang-switch button{
    background:none; border:none; cursor:pointer;
    color:var(--muted); font-weight:700; font-size:.78rem;
    padding:8px 13px; transition: background .2s, color .2s;
    min-width:40px; text-align:center;
  }
  .lang-switch button.on{ background: var(--accent); color: var(--bg); }
  .btn-sub{
    display:inline-flex; align-items:center; gap:7px;
    background: linear-gradient(180deg, var(--accent-hi), var(--accent));
    color:var(--bg); border:none;
    border-radius:9px; padding:8px 14px; font-size:.8rem; font-weight:800;
    cursor:pointer; white-space:nowrap; touch-action: manipulation; flex-shrink:0;
    box-shadow: 0 3px 0 var(--accent-lo), 0 8px 18px -6px rgba(0,0,0,.5);
    transition: filter .2s, transform .15s;
  }
  .btn-sub:hover{ filter: brightness(1.08); }
  .btn-sub:active{ transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-lo); }
  .btn-admin{
    display:inline-flex; align-items:center; gap:8px;
    background:none; border:1px solid var(--accent); color:var(--accent);
    border-radius:9px; padding:8px 15px; font-size:.82rem; font-weight:600;
    cursor:pointer; transition: background .2s, transform .15s;
    white-space:nowrap; touch-action: manipulation; flex-shrink:0;
  }
  .btn-admin:hover{ background: rgba(175,127,66,.16); }
  .btn-admin:active{ transform: scale(.96); }

  /* ============ Hero ============ */
  .hero{ max-width: 980px; margin:0 auto; padding: 62px 24px 26px; }
  .hero-meta{
    color:var(--muted); font-size:.72rem; font-weight:600;
    letter-spacing:.28em; text-transform:uppercase;
    display:flex; align-items:center; gap:14px;
  }
  html[dir="rtl"] .hero-meta{ letter-spacing:0; }
  .hero-meta::after{ content:""; flex:1; height:1px; background:var(--line); }
  .hero h1{
    font-size: clamp(2.1rem, 5vw, 3.4rem);
    font-weight:800; line-height:1.15; margin:14px 0 4px;
    text-shadow: 0 4px 22px rgba(0,0,0,.45);
    display:flex; align-items:center; flex-wrap:wrap; gap:8px;
  }
  .hero h1 em{ font-style:normal; color:var(--accent); text-shadow: 0 0 26px rgba(175,127,66,.4); }
  .hero-alt{
    color:var(--muted); font-size:1.05rem; font-weight:600;
    border-inline-start:3px solid var(--accent);
    padding-inline-start:12px; margin-top:6px;
  }
  html[dir="ltr"] .hero-alt{ font-family:'Noto Kufi Arabic',sans-serif; }
  .hero-desc{
    color:var(--card); opacity:.72; max-width:560px;
    margin-top:18px; line-height:1.65; font-size:.98rem;
  }
  .search{
    display:flex; align-items:center; gap:11px;
    max-width:560px; margin-top:26px;
    border:1px solid var(--line); border-radius:12px;
    padding:13px 16px; background: rgba(220,225,230,.06);
    transition: border-color .2s, box-shadow .25s;
    box-shadow: inset 0 2px 6px rgba(0,0,0,.28);
  }
  .search:focus-within{ border-color: var(--accent); box-shadow: inset 0 2px 6px rgba(0,0,0,.28), 0 0 0 3px rgba(175,127,66,.18); }
  .search.live{ animation: searchPulse .9s ease-in-out infinite; }
  @keyframes searchPulse{
    0%,100%{ box-shadow: inset 0 2px 6px rgba(0,0,0,.28), 0 0 0 0 rgba(175,127,66,.4); }
    50%{ box-shadow: inset 0 2px 6px rgba(0,0,0,.28), 0 0 0 6px rgba(175,127,66,0); }
  }
  .search svg{ color: var(--muted); transition: color .25s; }
  .search.live svg{ color: var(--accent); animation: wobble 1s ease-in-out infinite; }
  @keyframes wobble{
    0%,100%{ transform: rotate(0deg); }
    25%{ transform: rotate(-12deg); }
    75%{ transform: rotate(10deg); }
  }
  .search input{
    flex:1; background:none; border:none; outline:none;
    color:var(--card); font:inherit; font-size:.98rem; min-width:0;
  }
  .search input::placeholder{ color:var(--muted); }

  /* ============ Категории ============ */
  .cats{
    max-width:980px; margin:30px auto 0; padding:0 24px;
    display:flex; gap:9px; overflow-x:auto;
    scrollbar-width:thin; scrollbar-color:var(--muted) transparent;
    touch-action: pan-x manipulation;
    -webkit-overflow-scrolling: touch;
  }
  .cat-pill{
    flex-shrink:0; display:inline-flex; align-items:baseline; gap:9px;
    border:1px solid var(--line); border-radius:999px;
    background:none; color:var(--card);
    padding:9px 17px; font-size:.88rem; font-weight:600; cursor:pointer;
    transition: background .2s, border-color .2s, color .2s, transform .15s, box-shadow .2s;
    white-space:nowrap; touch-action: manipulation;
  }
  .cat-pill .cnt{ font-size:.72rem; color:var(--muted); font-weight:500; }
  .cat-pill:hover{ border-color: var(--accent); }
  .cat-pill.on{
    background: linear-gradient(180deg, var(--accent-hi), var(--accent));
    border-color:var(--accent); color:var(--bg);
    box-shadow: 0 3px 0 var(--accent-lo), 0 10px 22px -6px rgba(175,127,66,.45);
  }
  .cat-pill.on .cnt{ color:var(--bg); opacity:.7; }
  .cat-pill:active{ transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-lo); }

  /* ============ Подкатегории ============ */
  .subs{ max-width:980px; margin:14px auto 0; padding:0 24px; display:block; }
  .chip{
    background:none; border:1px solid var(--line); color:var(--card);
    border-radius:999px; padding:6px 13px;
    font-size:.8rem; font-weight:500; cursor:pointer;
    transition: border-color .2s, color .2s, background .2s, transform .15s;
    touch-action: manipulation;
  }
  .chip:hover{ border-color:var(--accent); }
  .chip.on{
    border-color:var(--accent); color:var(--accent);
    background:rgba(175,127,66,.14); font-weight:700;
    box-shadow: 0 3px 10px -4px rgba(175,127,66,.4);
  }
  .chip:active{ transform: scale(.96); }

  .level-cards{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(146px, 1fr));
    gap:9px; margin-top:6px;
    width:100%;
  }
  .level-card{
    display:flex; flex-direction:column; gap:2px;
    background: rgba(220,225,230,.05);
    border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; cursor:pointer; text-align:start;
    transition: border-color .2s, transform .18s, box-shadow .2s, background .2s;
    touch-action: manipulation;
    animation: fadeUp .45s both;
    min-width:0;
  }
  .level-card .lc-top{ display:flex; align-items:center; gap:7px; min-width:0; }
  .level-card .lc-arrow{
    margin-inline-start:auto; color:var(--muted);
    transition: transform .2s, color .2s;
    opacity:.7;
  }
  .level-card .lc-title{ font-size:.88rem; font-weight:700; color:var(--card); line-height:1.22; min-width:0; }
  .level-card .lc-sub{ font-size:.66rem; color:var(--muted); font-weight:500; }
  .level-card .lc-cnt{
    font-size:.64rem; color:var(--accent); font-weight:700;
    display:inline-block; margin-top:3px;
  }
  .level-card:hover{
    border-color: var(--accent);
    transform: translateY(-3px);
    box-shadow: 0 10px 24px -12px rgba(0,0,0,.5);
    background: rgba(175,127,66,.08);
  }
  .level-card:hover .lc-arrow{ color: var(--accent); transform: translateX(3px); }
  html[dir="rtl"] .level-card:hover .lc-arrow{ transform: translateX(-3px); }
  .level-card.on{
    border-color: var(--accent2);
    background: rgba(184,115,79,.13);
    box-shadow: 0 5px 18px -10px rgba(184,115,79,.5), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .level-card.on .lc-title{ color: var(--accent2); }
  .level-card.on .lc-arrow{ color: var(--accent2); }

  .subjects-block{
    margin-top:16px; padding-top:14px;
    border-top:1px solid var(--line);
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    animation: fadeUp .4s both;
  }
  .subjects-title{
    display:flex; align-items:center; gap:10px;
    font-size:.68rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted);
    flex-basis:100%; margin-bottom:2px;
  }
  html[dir="rtl"] .subjects-title{ text-transform:none; letter-spacing:0; }
  .subjects-title::after{ content:""; flex:1; height:1px; background:var(--line-soft); }
  .subjects-title svg{ color: var(--accent); }

  .btn-add{
    margin-inline-start:auto;
    display:inline-flex; align-items:center; gap:7px;
    background: linear-gradient(180deg, var(--accent-hi), var(--accent));
    color:var(--bg); border:none;
    border-radius:9px; padding:9px 16px;
    font-size:.85rem; font-weight:700; cursor:pointer;
    box-shadow: 0 3px 0 var(--accent-lo), 0 8px 18px -6px rgba(0,0,0,.5);
    transition: filter .2s, transform .15s;
    touch-action: manipulation;
  }
  .btn-add:hover{ filter: brightness(1.08); }
  .btn-add:active{ transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-lo); }
  .btn-add.hidden{ display:none; }

  /* ============ Список ============ */
  .list-wrap{ max-width:980px; margin:38px auto 90px; padding:0 24px; perspective: 1600px; }
  .list-head{
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
    padding-bottom:14px; border-bottom:2px solid var(--accent);
  }
  .list-head h2{ font-size: clamp(1.4rem, 3vw, 1.9rem); font-weight:800; text-shadow: 0 3px 14px rgba(0,0,0,.4); }
  .list-head .cnt{ color:var(--muted); font-size:.85rem; font-weight:600; }
  .conn{
    margin-inline-start:auto;
    display:inline-flex; align-items:center; gap:7px;
    font-size:.68rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted);
  }
  html[dir="rtl"] .conn{ text-transform:none; letter-spacing:0; }
  .conn .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--muted); flex-shrink:0;
    transition: background .3s;
  }
  .conn.online .dot{ background: var(--accent); animation: pulse 2.2s infinite; }
  .conn.cache  .dot{ background: var(--accent2); }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(175,127,66,.55); }
    50%{ box-shadow:0 0 0 5px rgba(175,127,66,0); }
  }
  .sheet{
    background:var(--card); color:var(--bg);
    border-radius:16px; overflow:hidden; margin-top:6px;
    box-shadow: 0 30px 70px -25px rgba(0,0,0,.55),
                inset 0 1px 0 rgba(255,255,255,.5);
    transform-style: preserve-3d;
  }
  .row{
    display:grid;
    grid-template-columns: 60px minmax(0,1fr) auto;
    gap: 8px 22px;
    padding: 25px 22px;
    border-bottom: 1px solid var(--line-soft);
    position:relative;
    animation: fadeUp .45s both;
    transition: transform .22s ease, box-shadow .22s ease, background .25s;
    transform-style: preserve-3d;
    cursor:pointer;
  }
  .row:last-child{ border-bottom:none; }
  .row::before{
    content:""; position:absolute; inset-inline-start:0; top:0; bottom:0;
    width:3px; background:var(--accent); opacity:0; transition:opacity .2s;
  }
  .row:hover{
    background: rgba(175,127,66,.1);
    transform: translateY(-4px) rotateX(1.4deg);
    box-shadow: 0 22px 40px -18px rgba(0,0,0,.45), 0 0 0 1px rgba(175,127,66,.25);
  }
  .row:hover::before{ opacity:1; }
  .num{
    font-weight:800; font-size:1.35rem;
    color:var(--accent); opacity:.9; padding-top:2px;
    text-shadow: 0 2px 0 rgba(125,95,51,.25);
  }
  .row-body{ min-width:0; }
  .row-top{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .row-top h3{ font-size:1.12rem; font-weight:700; line-height:1.3; color:var(--bg); }
  .tag{
    background: rgba(175,127,66,.2); color: var(--bg);
    font-size:.68rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    padding:4px 9px; border-radius:5px; white-space:nowrap;
    box-shadow: inset 0 -1px 0 rgba(125,95,51,.35);
  }
  html[dir="rtl"] .tag{ text-transform:none; letter-spacing:0; }
  .row-desc{
    color:var(--muted); font-size:.9rem; line-height:1.55; margin-top:8px;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .row-meta{ display:flex; flex-wrap:wrap; gap:7px 24px; margin-top:12px; font-size:.9rem; }
  .row-meta span{ display:inline-flex; align-items:center; gap:7px; min-width:0; }
  .row-meta svg{ color: var(--accent); }
  .row-meta .loc{ color:var(--muted); }
  .row-actions{
    display:flex; flex-direction:column; gap:9px; justify-content:center; align-items:stretch;
  }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    border-radius:9px; padding:9px 15px;
    font-size:.83rem; font-weight:700; cursor:pointer;
    text-decoration:none; border:1px solid transparent;
    transition: filter .2s, background .2s, transform .15s, box-shadow .15s;
    touch-action: manipulation;
  }
  .btn:active{ transform: translateY(2px); }
  .btn-solid{
    background: linear-gradient(180deg, var(--accent-hi), var(--accent));
    color:var(--bg);
    box-shadow: 0 3px 0 var(--accent-lo), 0 8px 18px -6px rgba(0,0,0,.4);
  }
  .btn-solid:hover{ filter:brightness(1.08); }
  .btn-solid:active{ box-shadow: 0 1px 0 var(--accent-lo); }
  .btn-outline{ border-color:var(--accent); color:var(--bg); box-shadow: inset 0 1px 0 rgba(255,255,255,.6); }
  .btn-outline:hover{ background:rgba(175,127,66,.15); }
  .btn-danger{ border-color:var(--accent2); color:var(--accent2); box-shadow: inset 0 1px 0 rgba(255,255,255,.5); }
  .btn-danger:hover{ background:rgba(184,115,79,.14); }
  .empty{ padding:64px 24px; text-align:center; color:var(--muted); }
  .empty svg{ opacity:.5; margin-bottom:14px; }
  .empty h4{ color:var(--bg); font-weight:700; margin-bottom:6px; font-size:1.05rem; }
  .empty p{ font-size:.9rem; max-width:340px; margin:0 auto; line-height:1.6; }

  /* ============ Звёзды на карточке в списке ============ */
  .card-rating{
    display:inline-flex; align-items:center; gap:7px;
    margin-top:7px;
  }
  .stars{ position:relative; display:inline-flex; line-height:0; }
  .stars-bg, .stars-fill{ display:inline-flex; gap:2px; }
  .stars-bg{ color:var(--muted); opacity:.55; }
  .stars-fill{
    position:absolute; inset-inline-start:0; top:0;
    overflow:hidden; white-space:nowrap; color:var(--accent);
  }
  .stars svg{ width:15px; height:15px; display:block; }
  .rating-num{ font-weight:800; font-size:.85rem; color:var(--accent); }
  .rating-cnt{ font-size:.72rem; color:var(--muted); font-weight:600; }
  .top-badge{
    display:inline-flex; align-items:center; gap:5px;
    background: linear-gradient(180deg, var(--accent-hi), var(--accent));
    color:var(--bg); font-size:.62rem; font-weight:800;
    padding:3px 8px; border-radius:5px; white-space:nowrap;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4);
  }

  /* ============ Звёзды в детальной карточке ============ */
  .rating-block{
    margin-top:22px; padding:18px;
    border:1px solid var(--line); border-radius:12px;
    background: rgba(24,32,47,.05);
  }
  .rate-label{
    font-size:.72rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
    color:var(--muted); margin-bottom:11px;
  }
  html[dir="rtl"] .rate-label{ text-transform:none; letter-spacing:0; }
  .rate-stars{ display:flex; gap:4px; }
  .rate-stars button{
    background:none; border:none; cursor:pointer; padding:5px;
    color:var(--muted); opacity:.5;
    transition: color .15s, opacity .15s, transform .15s;
    touch-action: manipulation;
  }
  .rate-stars button svg{ width:34px; height:34px; display:block; }
  .rate-stars button.lit{ color:var(--accent); opacity:1; }
  .rate-stars button:active{ transform: scale(.88); }
  .rate-stars.locked button{ cursor:default; }
  .rate-summary{
    margin-top:10px; font-size:.82rem; color:var(--muted); font-weight:600;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .rate-summary b{ color:var(--bg); }
  .rate-err{
    display:none;
    margin-top:10px;
    background: var(--accent2); color: var(--card);
    border-radius:9px; padding:10px 14px;
    font-size:.8rem; font-weight:700; line-height:1.45;
    word-break: break-word;
  }
  .rate-err.show{ display:block; animation: fadeUp .3s both; }
  .rate-err a{ color: var(--card); font-weight:800; text-decoration:underline; }

  .detail-tag{ display:inline-block; margin-bottom:12px; }
  .detail-desc{ color:var(--muted); line-height:1.6; margin:6px 0 14px; font-size:.95rem; }
  .detail-meta{ display:flex; flex-direction:column; gap:9px; margin:14px 0 18px; font-size:.95rem; }
  .detail-meta span{ display:inline-flex; align-items:center; gap:9px; }
  .detail-meta svg{ color: var(--muted); }
  .detail-actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .detail-actions .btn{ flex:1; min-width:130px; }

  /* ============ Модалка подписки ============ */
  .plans{ display:flex; gap:10px; margin-top:6px; }
  .plan{
    flex:1; display:flex; flex-direction:column; gap:6px;
    background: #18202f;
    border:1px solid var(--accent); border-radius:12px;
    padding:16px 12px; cursor:pointer; text-align:center;
    transition: border-color .2s, transform .18s, box-shadow .2s, background .2s;
    touch-action: manipulation;
    animation: fadeUp .45s both;
    box-shadow: 0 6px 16px -8px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07);
  }
  .plan:hover{
    transform: translateY(-3px);
    box-shadow: 0 12px 26px -10px rgba(0,0,0,.55);
    background: #1E2839;
  }
  .plan.on{
    background: #1E2839;
    border:2px solid var(--accent);
    box-shadow: 0 8px 22px -10px rgba(175,127,66,.55), inset 0 1px 0 rgba(255,255,255,.1);
  }
  .plan-name{ font-size:.82rem; font-weight:700; color:#DCE1E6; }
  .plan-price{
    font-size:1.45rem; font-weight:800; color: var(--accent-hi);
    text-shadow: 0 2px 8px rgba(0,0,0,.6);
  }
  .plan-note{ font-size:.72rem; font-weight:600; color:#9BA8B6; }
  .sub-contact{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-top:14px; padding:10px 14px;
    border:1px solid var(--line); border-radius:10px;
    background: #18202f; color:#DCE1E6;
    font-size:.8rem; font-weight:600; flex-wrap:wrap;
  }
  .sub-contact .ltr-num{ color: var(--accent-hi); font-weight:800; }
  .sub-hint{
    margin-top:14px; font-size:.72rem; color:var(--muted);
    line-height:1.5; text-align:center;
  }

  /* ============ Появление при скролле ============ */
  .reveal{ opacity:0; transform: translateY(26px); transition: opacity .6s ease, transform .6s ease; }
  .reveal.vis{ opacity:1; transform:none; }

  /* ============ Футер ============ */
  footer{
    border-top:1px solid var(--line);
    padding:26px 24px 90px; text-align:center;
    color:var(--muted); font-size:.8rem;
  }

  /* ============ Плавающая кнопка выхода ============ */
  .float-logout{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
    z-index:60; display:none;
    align-items:center; gap:9px;
    background: linear-gradient(180deg, #C9855D, var(--accent2));
    color:var(--bg);
    border:none; border-radius:999px;
    padding:13px 22px; font-weight:700; font-size:.9rem; cursor:pointer;
    box-shadow: 0 4px 0 #8a5034, 0 16px 34px -6px rgba(0,0,0,.55);
    transition: filter .2s;
    touch-action: manipulation;
    max-width:92vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .float-logout:hover{ filter:brightness(1.1); }
  .float-logout:active{ transform: translateX(-50%) translateY(3px); box-shadow: 0 1px 0 #8a5034; }
  .float-logout.show{ display:inline-flex; animation: fadeUp .35s both; }

  /* ============ Тосты ============ */
  #toastWrap{
    position:fixed; top:78px; left:50%; transform:translateX(-50%);
    z-index:10050;
    display:flex; flex-direction:column; gap:9px; align-items:center;
    pointer-events:none; width:min(92vw, 480px);
  }
  .toast{
    background:var(--card); color:var(--bg);
    border-inline-start:4px solid var(--accent);
    border-radius:10px; padding:13px 20px;
    font-size:.9rem; font-weight:600;
    box-shadow: 0 18px 40px -10px rgba(0,0,0,.5);
    animation: fadeUp .3s both; max-width:100%;
    word-break: break-word;
  }
  .toast.err{ border-inline-start-color: var(--accent2); }
  .toast.out{ opacity:0; transform:translateY(-8px); transition:opacity .3s, transform .3s; }

  /* ============ Модальные окна ============ */
  .overlay{
    position:fixed; inset:0;
    z-index:9999;
    background:rgba(24,32,47,.55);
    backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
    display:flex; align-items:center; justify-content:center;
    padding:20px; opacity:0; pointer-events:none;
    transition: opacity .28s;
    touch-action: manipulation;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .modal{
    background:var(--card); color:var(--bg);
    width:100%; max-width:460px; max-height:90vh; overflow-y:auto;
    border-radius:16px; padding:30px 28px;
    transform: translateY(16px) scale(.96) rotateX(2deg);
    transition: transform .28s;
    box-shadow: 0 50px 110px -20px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.6);
    touch-action: manipulation;
    -webkit-overflow-scrolling: touch;
  }
  .overlay.show .modal{ transform:none; }
  .modal-head{ display:flex; align-items:flex-start; gap:14px; margin-bottom:8px; }
  .modal-head h3{ font-size:1.3rem; font-weight:800; flex:1; line-height:1.25; color:var(--bg); }
  .modal-close{
    background:none; border:none; color:var(--muted); cursor:pointer;
    padding:9px; border-radius:9px; display:flex; flex-shrink:0;
    touch-action: manipulation;
  }
  .modal-close:hover{ color:var(--accent2); background:rgba(104,116,138,.15); }
  .modal-close:active{ transform: scale(.92); }
  .modal-back{
    background:rgba(175,127,66,.14); color:var(--bg);
    border:1px solid var(--accent); border-radius:9px;
    padding:7px 14px 7px 10px; font-weight:700; font-size:.8rem;
    cursor:pointer; display:inline-flex; align-items:center; gap:7px;
    margin-bottom:14px;
    touch-action: manipulation;
    transition: background .2s, transform .15s;
  }
  .modal-back:hover{ background:rgba(175,127,66,.24); }
  .modal-back:active{ transform: scale(.96); }
  html[dir="rtl"] .modal-back{ padding:7px 10px 7px 14px; }
  .modal-desc{ color:var(--muted); font-size:.9rem; line-height:1.55; margin-bottom:22px; }

  .field{ margin-bottom:17px; }
  .field label{
    display:block; font-size:.72rem; font-weight:700;
    letter-spacing:.07em; text-transform:uppercase;
    color:var(--muted); margin-bottom:7px;
  }
  html[dir="rtl"] .field label{ text-transform:none; }
  .field label .req{ color: var(--accent2); }
  .field input, .field select, .field textarea{
    width:100%;
    background: var(--bg); color: var(--card);
    border:1px solid transparent; border-radius:10px;
    padding:12px 14px; font:inherit; font-size:16px;
    outline:none; transition: border-color .2s, box-shadow .2s;
    box-shadow: inset 0 2px 5px rgba(0,0,0,.3);
    touch-action: manipulation;
  }
  .field textarea{ resize:vertical; min-height:96px; line-height:1.55; }
  .field input:focus, .field select:focus, .field textarea:focus{
    border-color: var(--accent);
    box-shadow: inset 0 2px 5px rgba(0,0,0,.3), 0 0 0 3px rgba(175,127,66,.18);
  }
  .field input::placeholder, .field textarea::placeholder{ color:var(--muted); }
  .field select{ appearance:none; cursor:pointer; }
  .counter{ text-align:end; font-size:.72rem; color:var(--muted); margin-top:5px; }
  .counter.over{ color:var(--accent2); font-weight:700; }
  .modal-actions{ display:flex; gap:11px; margin-top:24px; }
  .modal-actions .btn{ flex:1; padding:13px; font-size:.92rem; }

  .modal-submit{
    width:100%; margin-top:4px; padding:15px; font-size:1rem !important;
    touch-action: manipulation;
    min-height:52px;
  }
  .modal-submit:active{ transform: scale(.98); filter:brightness(1.15); }
  .modal-submit[disabled]{ opacity:.55; pointer-events:none; }

  .err-banner{
    display:none;
    background: var(--accent2); color: var(--card);
    border-radius:10px; padding:12px 16px;
    font-size:.88rem; font-weight:700;
    margin-bottom:18px; text-align:center;
    word-break: break-word;
    box-shadow: 0 6px 16px -6px rgba(184,115,79,.6);
  }
  .err-banner.show{ display:block; animation: fadeUp .3s both; }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(12px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ============ Мобильная версия ============ */
  @media (max-width: 760px){
    .moon, .moon::after{ display:none; }

    body{ font-size:15px; }
    .topbar{ height:56px; padding:0 10px; gap:7px; }
    .brand{ font-size:.88rem; letter-spacing:.06em; gap:7px; }
    .brand svg{ width:20px; height:20px; }
    .brand-sub{ display:none; }
    .lang-switch button{ padding:7px 8px; font-size:.7rem; min-width:32px; }
    .btn-sub{ padding:7px 10px; }
    .btn-sub .t{ display:none; }
    .btn-admin{ padding:7px 9px; }
    .btn-admin .t{ display:none; }

    .hero{ padding:34px 14px 18px; }
    .hero h1{ font-size: clamp(1.55rem, 7.5vw, 2.1rem); gap:6px; }
    .hero-alt{ font-size:.9rem; }
    .hero-desc{ font-size:.9rem; margin-top:12px; }
    .search{ padding:10px 12px; font-size:.9rem; }

    .cube-stage{ width:32px; height:32px; }
    .cube{ width:32px; height:32px; }
    .cube .f1{ transform: translateZ(16px); }
    .cube .f2{ transform: rotateY(180deg) translateZ(16px); }
    .cube .f3{ transform: rotateY(90deg)  translateZ(16px); }
    .cube .f4{ transform: rotateY(-90deg) translateZ(16px); }
    .cube .f5{ transform: rotateX(90deg)  translateZ(16px); }
    .cube .f6{ transform: rotateX(-90deg) translateZ(16px); }

    .cats{ padding:0 14px; gap:7px; }
    .cat-pill{ padding:7px 12px; font-size:.8rem; }
    .cat-pill .cnt{ font-size:.66rem; }

    .subs{ padding:0 14px; }
    .chip{ padding:5px 11px; font-size:.74rem; }
    .level-cards{ grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap:7px; }
    .level-card{ padding:9px 10px; }
    .level-card .lc-title{ font-size:.8rem; }
    .subjects-block{ margin-top:12px; padding-top:10px; gap:6px; }

    .list-wrap{ margin:26px auto 80px; padding:0 14px; }
    .list-head h2{ font-size:1.15rem; }
    .row{ grid-template-columns: minmax(0,1fr); gap:12px; padding:18px 14px; }
    .row:hover{ transform: translateY(-2px); }
    .num{ display:none; }
    .row-top h3{ font-size:1rem; }
    .tag{ font-size:.62rem; max-width:100%; white-space:normal; }
    .row-desc{ font-size:.84rem; }
    .row-meta{ font-size:.84rem; gap:5px 16px; }
    .row-actions{ flex-direction:row; flex-wrap:wrap; }
    .row-actions .btn{ flex:1; min-width:100px; padding:8px 10px; font-size:.76rem; }
    .btn-add{ margin-inline-start:0; width:100%; justify-content:center; }

    .conn{ margin-inline-start:0; width:100%; }
    .float-logout{ font-size:.8rem; padding:11px 16px; bottom:16px; }

    .modal{ padding:22px 18px; max-height:92vh; }
    .modal-head h3{ font-size:1.1rem; }
    .overlay{ padding:12px; align-items:center; }
    .rate-stars button svg{ width:38px; height:38px; }
    .plans{ flex-direction:column; }
  }
</style>
</head>
<body>

<!-- Фоновая сцена -->
<div class="bg-deco" aria-hidden="true">
  <div class="moon" id="moon"></div>
  <div class="ring r1"></div>
  <div class="ring r2"></div>
  <span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span>
  <span class="spark s4"></span><span class="spark s5"></span><span class="spark s6"></span>
</div>

<header class="topbar">
  <a class="brand" href="#">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
      <path d="M12 1.5 21.5 7v10L12 22.5 2.5 17V7L12 1.5z" stroke="#AF7F42" stroke-width="1.7"/>
      <path d="M12 6.6 16.9 9.4v5.4L12 17.7 7.1 14.8V9.4L12 6.6z" fill="#AF7F42"/>
    </svg>
    RAKKA HUB<span class="brand-sub">الرقّة</span>
  </a>
  <div class="lang-switch" role="group" aria-label="Language">
    <button id="langRu" type="button">RU</button>
    <button id="langAr" class="on" type="button">ع</button>
    <button id="langEn" type="button">EN</button>
  </div>
  <button class="btn-sub" id="subBtn" type="button">
    <span class="ic"></span><span class="t" data-i18n="subBtn"></span>
  </button>
  <button class="btn-admin" id="adminBtn" type="button">
    <span class="ic"></span><span class="t" data-i18n="adminBtn"></span>
  </button>
</header>

<section class="hero reveal">
  <div class="hero-meta">35.95° N · 39.02° E</div>
  <h1>
    <span data-i18n-html="heroTitle"></span>
    <span class="cube-stage" aria-hidden="true">
      <span class="cube">
        <span class="face f1"></span><span class="face f2"></span>
        <span class="face f3"></span><span class="face f4"></span>
        <span class="face f5"></span><span class="face f6"></span>
      </span>
    </span>
  </h1>
  <div class="hero-alt" id="heroAlt"></div>
  <p class="hero-desc" data-i18n="heroDesc"></p>
  <div class="search" id="searchBox">
    <span id="searchIcon"></span>
    <input id="searchInput" type="search" inputmode="search" data-i18n-ph="searchPh">
  </div>
</section>

<nav class="cats reveal" id="cats" aria-label="Категории"></nav>
<div class="subs reveal" id="subs"></div>

<main class="list-wrap reveal" id="listWrap">
  <div class="list-head">
    <h2 id="listTitle"></h2>
    <span class="cnt" id="listCount"></span>
    <span class="conn" id="connState"><span class="dot"></span><span id="connText"></span></span>
  </div>
  <div class="sheet">
    <div id="list"></div>
    <div id="empty" class="empty" hidden>
      <div id="emptyIcon"></div>
      <h4 data-i18n="emptyTitle"></h4>
      <p data-i18n="emptyDesc"></p>
    </div>
  </div>
</main>

<footer class="reveal" data-i18n="footer"></footer>

<button class="float-logout" id="floatLogout" type="button">
  <span id="logoutIcon"></span><span data-i18n="logoutFloat"></span>
</button>

<div id="toastWrap"></div>

<!-- Детальная карточка + оценка -->
<div class="overlay" id="detailOverlay" role="dialog" aria-modal="true">
  <div class="modal" id="detailBody"></div>
</div>

<!-- Модальное окно: подписка -->
<div class="overlay" id="subOverlay" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-head">
      <h3 data-i18n="subTitle"></h3>
      <button class="modal-close" type="button" data-close="subOverlay" aria-label="Close"></button>
    </div>
    <p class="modal-desc" data-i18n="subDesc"></p>
    <div class="plans">
      <button type="button" class="plan" data-plan="m1" style="animation-delay:0ms">
        <span class="plan-name" data-i18n="subM1"></span>
        <span class="plan-price" dir="ltr">$2.50</span>
        <span class="plan-note" data-i18n="subPer1"></span>
      </button>
      <button type="button" class="plan" data-plan="m3" style="animation-delay:80ms">
        <span class="plan-name" data-i18n="subM3"></span>
        <span class="plan-price" dir="ltr">$7.00</span>
        <span class="plan-note" data-i18n="subPer3"></span>
      </button>
      <button type="button" class="plan" data-plan="y1" style="animation-delay:160ms">
        <span class="plan-name" data-i18n="subY1"></span>
        <span class="plan-price" dir="ltr">$15.00</span>
        <span class="plan-note" data-i18n="subPer12"></span>
      </button>
    </div>
    <button class="btn btn-solid modal-submit" type="button" id="subPayBtn" data-i18n="subPay"></button>
    <div class="sub-contact">
      <span id="subContactName"></span>
      <span class="ltr-num" dir="ltr">+963 994 461 602</span>
    </div>
    <div class="sub-hint" data-i18n="subHint"></div>
  </div>
</div>

<!-- Модальное окно: вход администратора -->
<div class="overlay" id="loginOverlay" role="dialog" aria-modal="true">
  <form class="modal" id="loginForm" novalidate>
    <div class="modal-head">
      <h3 data-i18n="loginTitle"></h3>
      <button class="modal-close" type="button" data-close="loginOverlay" aria-label="Close"></button>
    </div>
    <p class="modal-desc" data-i18n="loginDesc"></p>
    <div class="err-banner" id="loginErr" role="alert"></div>
    <div class="field">
      <label for="emailInput" data-i18n="email"></label>
      <input type="email" id="emailInput" autocomplete="username"
             autocapitalize="none" autocorrect="off" spellcheck="false"
             inputmode="email" enterkeyhint="next">
    </div>
    <div class="field">
      <label for="passInput" data-i18n="password"></label>
      <input type="password" id="passInput" autocomplete="current-password" enterkeyhint="go">
    </div>
    <button class="btn btn-solid modal-submit" type="button" id="loginSubmitBtn" data-i18n="login"></button>
  </form>
</div>

<!-- Модальное окно: добавление карточки -->
<div class="overlay" id="addOverlay" role="dialog" aria-modal="true">
  <form class="modal" id="addForm" novalidate>
    <div class="modal-head">
      <h3 data-i18n="addTitle"></h3>
      <button class="modal-close" type="button" data-close="addOverlay" aria-label="Close"></button>
    </div>
    <div class="err-banner" id="addErr" role="alert"></div>
    <div class="field">
      <label data-i18n="fCategory"></label>
      <select id="fCat"></select>
    </div>
    <div class="field" id="fLevelField" hidden>
      <label data-i18n="level"></label>
      <select id="fLevel"></select>
    </div>
    <div class="field">
      <label data-i18n="fSub"></label>
      <select id="fSub"></select>
    </div>
    <div class="field">
      <label data-i18n="fTitle"></label>
      <input type="text" id="fTitle" autocapitalize="words">
    </div>
    <div class="field">
      <label data-i18n="fPhone"></label>
      <input type="tel" id="fPhone" inputmode="tel" placeholder="+963 9XX XXX XXX">
    </div>
    <div class="field">
      <label id="fLocLabel" data-i18n="fLocation"></label>
      <input type="text" id="fLoc">
    </div>
    <div class="field">
      <label data-i18n="fDesc"></label>
      <textarea id="fDesc" maxlength="500"></textarea>
      <div class="counter" id="descCounter">0 / 500</div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" type="button" data-close="addOverlay" data-i18n="cancel"></button>
      <button class="btn btn-solid" type="submit" data-i18n="save"></button>
    </div>
  </form>
</div>

<!-- Модальное окно: подтверждение удаления -->
<div class="overlay" id="confirmOverlay" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-head">
      <h3 data-i18n="confirmTitle"></h3>

      { id:"grocery", ru:"Продуктовый", ar:"بقالة", en:"Grocery" },
      { id:"auto", ru:"Авто", ar:"سيارات", en:"Auto" },
      { id:"realty", ru:"Недвижимость/Квартиры", ar:"عقارات", en:"Real estate" },
      { id:"fabric", ru:"Ткани", ar:"أقمشة", en:"Fabrics" },
      { id:"clothing", ru:"Одежда", ar:"ملابس", en:"Clothing" },
      { id:"gold", ru:"Магазины золота", ar:"مصاغ الذهب", en:"Gold shops" },
      { id:"autoparts", ru:"Авто запчасти", ar:"قطع سيارات", en:"Auto parts" },
      { id:"hookah", ru:"Магазины кальянов", ar:"معارض الأراكيل", en:"Hookah shops" }
    ]},
    { id: "services", base: "services", cardMode: true,
      ru: "Услуги", ar: "خدمات", en: "Services", subs: [
      { id:"hotels", ru:"Отели", ar:"فنادق", en:"Hotels" },
      { id:"restaurants", ru:"Рестораны", ar:"مطاعم", en:"Restaurants" },
      { id:"cafes", ru:"Кафе", ar:"مقاهي", en:"Cafés" },
      { id:"transport", ru:"Перевозки меж городов", ar:"نقل بين المدن", en:"Intercity transport" }
    ]}
  ];

  const levelsOf = (cat) => cat.levels || [{ id: cat.id, ru: cat.ru, ar: cat.ar, en: cat.en, subs: cat.subs }];
  const levelIdsOf = (cat) => levelsOf(cat).map(l => l.id);

  /* ================= Иконки ================= */
  const ICONS = {
    phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.13.96.36 1.9.7 2.8a2 2 0 0 1-.45 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.45c.9.34 1.84.57 2.8.7A2 2 0 0 1 22 16.9z"/>',
    pin: '<path d="M12 21s-7-6.1-7-11a7 7 0 1 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/>',
    x: '<path d="M18 6 6 18M6 6l12 12"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    trash: '<path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
    logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/>',
    lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
    chat: '<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5z"/>',
    inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.4 5.4 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.4-6.6A2 2 0 0 0 17 4H7a2 2 0 0 0-1.6 1.4z"/>',
    arrow: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
    back: '<path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>',
    book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
    star: '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.56 5.82 22 7 14.14l-5-4.87 6.91-1.01L12 2z"/>',
    crown: '<path d="M3 18h18"/><path d="M4 8l4 4 4-8 4 8 4-4-1 10H5L4 8z"/>'
  };
  const icon = (n, s = 16) =>
    `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
  const starSVG = (filled, s = 15) =>
    `<svg width="${s}" height="${s}" viewBox="0 0 24 24" ${filled ? 'fill="currentColor" stroke="currentColor" stroke-width="1"' : 'fill="none" stroke="currentColor" stroke-width="1.6"'}>${ICONS.star}</svg>`;

  /* ================= Состояние ================= */
  const state = {
    lang: (() => {
      const l = store.get("rakka_lang");
      return ["ru","ar","en"].includes(l) ? l : "ar";
    })(),
    cat: "doctors",
    level: "doctors",
    sub: "all",
    search: "",
    admin: false,
    docs: [],
    votes: [],
    detailId: null,
    levelSelected: false
  };
  let pendingDeleteId = null;
  const voteBusy = new Set();

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  const t = (key, lang = state.lang) => I18N[lang][key] || I18N.ar[key] || I18N.ru[key] || key;
  const nm = (o) => o[state.lang] || o.ar || o.ru;
  const catById = (id) => CATS.find(c => c.id === id);

  function subName(groupId, subId) {
    for (const c of CATS) {
      for (const l of levelsOf(c)) {
        if (l.id === groupId) {
          const s = l.subs.find(x => x.id === subId);
          if (s) return nm(s);
          return subId;
        }
      }
    }
    return subId;
  }
  const catName = (c) => nm(c);
  const levelName = (l) => nm(l);

  function withTimeout(promise, ms = 15000) {
    return Promise.race([
      promise,
      new Promise((_, rej) => setTimeout(() => rej({ code: "app/timeout" }), ms))
    ]);
  }

  /* ================= Тосты и плашки ================= */
  const toastWrap = $("toastWrap");
  function toast(msg, type = "ok") {
    const d = document.createElement("div");
    d.className = "toast" + (type === "err" ? " err" : "");
    d.textContent = msg;
    toastWrap.appendChild(d);
    setTimeout(() => { d.classList.add("out"); setTimeout(() => d.remove(), 350); }, 3000);
  }
  function banner(el, key) { bannerMsg(el, t(key)); }
  function bannerMsg(el, text) {
    el.textContent = text;
    el.classList.add("show");
    clearTimeout(el._tm);
    el._tm = setTimeout(() => el.classList.remove("show"), 3000);
  }

  /* ================= Система оценок ================= */
  function ratingOf(p) {
    const list = state.votes.filter(v => v.providerId === p.id);
    const count = list.length;
    const avg = count ? list.reduce((s, v) => s + (v.value || 0), 0) / count : 0;
    const mine = list.find(v => v.visitorId === visitorId);
    return { count, avg: Math.round(avg * 10) / 10, mine: mine ? mine.value : 0 };
  }

  function starsStatic(avg) {
    const pct = Math.max(0, Math.min(100, (avg / 5) * 100));
    return `<span class="stars"><span class="stars-bg">${starSVG(false).repeat(5)}</span><span class="stars-fill" style="width:${pct}%">${starSVG(true).repeat(5)}</span></span>`;
  }

  function cardRatingHTML(p) {
    const { count, avg } = ratingOf(p);
    if (!count) return "";
    return `<div class="card-rating">${starsStatic(avg)}<span class="rating-num">${avg.toFixed(1)}</span><span class="rating-cnt">\u2066(${count})\u2069 ${esc(t("votes"))}</span></div>`;
  }

  async function vote(pid, value) {
    if (voteBusy.has(pid)) return;
    const myRef = doc(db, "votes", pid + "__" + visitorId);
    try {
      const existing = await withTimeout(getDoc(myRef), 10000);
      if (existing.exists()) { toast(t("alreadyRated")); return; }
    } catch (e) { /* чтение всем разрешено; при ошибке продолжим */ }
    voteBusy.add(pid);
    const errEl = document.getElementById("rateErr");
    if (errEl) errEl.classList.remove("show");
    try {
      await withTimeout(setDoc(myRef, {
        providerId: pid,
        visitorId,
        value,
        createdAt: serverTimestamp()
      }), 15000);
      toast(t("thanksToast"));
    } catch (err) {
      console.error("Vote error:", err && err.code, err && err.message);
      const s = String((err && err.code || "") + " " + (err && err.message || ""));
      const denied = err && (err.code === "permission-denied" || s.includes("permission"));
      if (denied) {
        toast(t("alreadyRated"));
      } else if (errEl) {
        errEl.textContent = "⚠ " + ((err && err.code) || t("loadError"));
        errEl.classList.add("show");
        clearTimeout(errEl._tm);
        errEl._tm = setTimeout(() => errEl.classList.remove("show"), 8000);
        toast("⚠ " + ((err && err.code) || t("loadError")), "err");
      }
    } finally {
      voteBusy.delete(pid);
    }
  }

  /* ================= Данные ================= */
  let listening = false;

  function setConn(mode) {
    const el = $("connState");
    el.className = "conn " + mode;
    $("connText").textContent = t(mode === "online" ? "connOnline" : "connCache");
  }

  function applySnapshot(snap) {
    state.docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    state.docs.sort((a, b) => {
      const sa = (a.createdAt && a.createdAt.seconds) || 0;
      const sb = (b.createdAt && b.createdAt.seconds) || 0;
      return sb - sa;
    });
    renderAll();
    setConn(snap.metadata.fromCache ? "cache" : "online");
  }

  let votesRetry = 0;
  function startVotesListener() {
    try {
      onSnapshot(collection(db, "votes"),
        snap => {
          votesRetry = 0;
          state.votes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          renderAll();
          if (state.detailId && $("detailOverlay").classList.contains("show")) renderDetail(state.detailId);
        },
        err => {
          console.error("Votes snapshot error:", err);
          if (votesRetry < 60) { votesRetry++; setTimeout(startVotesListener, 5000); }
        });
    } catch (e) { console.error(e); }
  }

  function startListener() {
    try {
      onSnapshot(collection(db, "providers"),
        snap => applySnapshot(snap),
        err => {
          console.error("Snapshot error:", err);
          setConn("cache");
          loadOnce();
        });
      startVotesListener();
      listening = true;
    } catch (e) {
      console.error(e);
      loadOnce();
    }
  }

  async function loadOnce() {
    try {
      const snap = await withTimeout(getDocs(collection(db, "providers")), 15000);
      applySnapshot(snap);
    } catch (e) { console.error(e); }
  }

  async function dbAdd(data) {
    await withTimeout(
      addDoc(collection(db, "providers"), { ...data, createdAt: serverTimestamp() }), 20000);
    if (!listening) await loadOnce();
  }

  async function dbRemove(id) {
    await withTimeout(deleteDoc(doc(db, "providers", id)), 20000);
    if (!listening) await loadOnce();
  }

  /* ================= Рендер ================= */
  function renderCats() {
    const el = $("cats");
    el.innerHTML = CATS.map(c => {
      const cnt = state.docs.filter(d => levelIdsOf(c).includes(d.group)).length;
      return `<button type="button" class="cat-pill${state.cat === c.id ? " on" : ""}" data-cat="${c.id}">
        ${esc(catName(c))}<span class="cnt">${cnt}</span>
      </button>`;
    }).join("");
  }

  function renderSubs() {
    const el = $("subs");
    const cat = catById(state.cat);
    const lvls = levelsOf(cat);
    const cur = lvls.find(l => l.id === state.level) || lvls[0];
    state.level = cur.id;

    if (cat.cardMode) {
      const cntAll = state.docs.filter(d => d.group === cat.id).length;
      const card = (id, name, cnt, i, on) => `
        <button type="button" class="level-card${on ? " on" : ""}" data-subcard="${id}" style="animation-delay:${Math.max(i,0)*70}ms">
          <span class="lc-top">
            <span class="lc-title">${esc(name)}</span>
            <span class="lc-arrow">${icon("arrow", 14)}</span>
          </span>
          <span class="lc-cnt">${cnt}</span>
        </button>`;
      el.innerHTML = `<div class="level-cards">
          ${card("all", t("all"), cntAll, -1, state.sub === "all")}
          ${cat.subs.map((s, i) =>
            card(s.id, nm(s),
                 state.docs.filter(d => d.group === cat.id && d.subcategory === s.id).length,
                 i, state.sub === s.id)).join("")}
        </div>
        <div class="subjects-block">
          <button type="button" id="addCardBtn" class="btn-add${state.admin ? "" : " hidden"}">
            ${icon("plus", 15)}<span>${esc(t("addCard"))}</span></button>
        </div>`;
      return;
    }

    if (cat.levels) {
      const levelCard = (l, i, chosenCls) => `
        <button type="button" class="level-card${chosenCls}" data-level="${l.id}" style="animation-delay:${i*90}ms">
          <span class="lc-top">
            <span class="lc-title">${esc(levelName(l))}</span>
            <span class="lc-arrow">${icon("arrow", 14)}</span>
          </span>
          <span class="lc-sub">${esc(t("chooseLevel"))}</span>
          <span class="lc-cnt">${state.docs.filter(d => d.group === l.id).length}</span>
        </button>`;

      if (!state.levelSelected) {
        el.innerHTML = `<div class="level-cards">${lvls.map((l,i) => levelCard(l,i,"")).join("")}</div>`;
        return;
      }
      el.innerHTML = `
        <div class="level-cards">
          ${lvls.map((l,i) => levelCard(l,i, l.id === state.level ? " on" : "")).join("")}
        </div>
        <div class="subjects-block">
          <div class="subjects-title">${icon("book", 14)}<span>${esc(t("subjectsWord"))}</span></div>
          <button type="button" class="chip${state.sub === "all" ? " on" : ""}" data-sub="all">${esc(t("all"))}</button>
          ${cur.subs.map(s =>
            `<button type="button" class="chip${state.sub === s.id ? " on" : ""}" data-sub="${s.id}">${esc(nm(s))}</button>`).join("")}
          <button type="button" id="addCardBtn" class="btn-add${state.admin ? "" : " hidden"}">
            ${icon("plus", 15)}<span>${esc(t("addCard"))}</span></button>
        </div>`;
      return;
    }

    let html = `<button type="button" class="chip${state.sub === "all" ? " on" : ""}" data-sub="all">${esc(t("all"))}</button>`;
    html += cur.subs.map(s =>
      `<button type="button" class="chip${state.sub === s.id ? " on" : ""}" data-sub="${s.id}">${esc(nm(s))}</button>`
    ).join("");
    html += `<button type="button" id="addCardBtn" class="btn-add${state.admin ? "" : " hidden"}">
      ${icon("plus", 15)}<span>${esc(t("addCard"))}</span></button>`;
    el.innerHTML = html;
  }

  function filtered() {
    let items = state.docs.filter(d => d.group === state.level);
    if (state.sub !== "all") items = items.filter(d => d.subcategory === state.sub);
    if (state.search) {
      const s = state.search.toLowerCase().replace(/\s/g, "");
      items = items.filter(d =>
        (d.title || "").toLowerCase().includes(state.search.toLowerCase()) ||
        (d.description || "").toLowerCase().includes(state.search.toLowerCase()) ||
        (d.phone || "").replace(/\s/g, "").includes(s)
      );
    }
    return items;
  }

  function renderList() {
    const cat = catById(state.cat);
    const lvls = levelsOf(cat);
    const cur = lvls.find(l => l.id === state.level) || lvls[0];
    let title = catName(cat);
    if (cat.levels && state.levelSelected) title += " · " + levelName(cur);
    if (state.sub !== "all") title += " · " + subName(state.level, state.sub);

    const items = filtered();
    items.sort((a, b) => {
      const A = ratingOf(a), B = ratingOf(b);
      const sa = A.count ? A.avg : -1;
      const sb = B.count ? B.avg : -1;
      if (sb !== sa) return sb - sa;
      if (B.count !== A.count) return B.count - A.count;
      return 0;
    });

    $("listTitle").textContent = title;
    $("listCount").textContent = `${t("found")}: ${items.length}`;

    const listEl = $("list");
    listEl.innerHTML = items.map((p, i) => {
      const tel = (p.phone || "").replace(/[^\d+]/g, "");
      const wa = tel.replace(/\D/g, "");
      const r = ratingOf(p);
      const top = r.count && r.avg >= 4.5 ? `<span class="top-badge">${icon("crown", 11)}${esc(t("topBadge"))}</span>` : "";
      return `
      <article class="row" data-id="${esc(p.id)}" style="animation-delay:${Math.min(i * 45, 400)}ms">
        <div class="num">${String(i + 1).padStart(2, "0")}</div>
        <div class="row-body">
          <div class="row-top">
            <h3>${esc(p.title)}</h3>
            <span class="tag">${esc(subName(p.group, p.subcategory))}</span>
            ${top}
          </div>
          ${cardRatingHTML(p)}
          ${p.description ? `<p class="row-desc">${esc(p.description)}</p>` : ""}
          <div class="row-meta">
            ${p.phone ? `<span class="ltr-num">${icon("phone", 15)}${phoneHTML(p.phone)}</span>` : ""}
            ${p.location ? `<span class="loc">${icon("pin", 15)}${esc(p.location)}</span>` : ""}
          </div>
        </div>
        <div class="row-actions">
          ${tel ? `<a class="btn btn-solid" href="tel:${esc(tel)}">${icon("phone", 14)}${esc(t("call"))}</a>` : ""}
          ${wa ? `<a class="btn btn-outline" href="https://wa.me/${esc(wa)}" target="_blank" rel="noopener">${icon("chat", 14)}WhatsApp</a>` : ""}
          ${state.admin ? `<button type="button" class="btn btn-danger row-del" data-id="${esc(p.id)}">${icon("trash", 14)}${esc(t("delete"))}</button>` : ""}
        </div>
      </article>`;
    }).join("");
    $("empty").hidden = items.length > 0;
    $("emptyIcon").innerHTML = icon("inbox", 42);
  }

  function renderAll() { renderCats(); renderSubs(); renderList(); }

  function applyLang() {
    const L = state.lang;
    document.documentElement.lang = L;
    document.documentElement.dir = (L === "ar") ? "rtl" : "ltr";
    $("langRu").classList.toggle("on", L === "ru");
    $("langAr").classList.toggle("on", L === "ar");
    $("langEn").classList.toggle("on", L === "en");
    document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
    document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
    document.querySelectorAll("[data-i18n-html]").forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
    $("heroAlt").textContent = t("heroTag");
    const sc = document.getElementById("subContactName");
    if (sc) sc.textContent = t("subContact");
    setConn($("connState").classList.contains("cache") ? "cache" : "online");
    renderAll();
    if (state.detailId && $("detailOverlay").classList.contains("show")) renderDetail(state.detailId);
  }

  /* ================= Детальная карточка ================= */
  function detailHTML(p) {
    const tel = (p.phone || "").replace(/[^\d+]/g, "");
    const wa = tel.replace(/\D/g, "");
    const { count, avg, mine } = ratingOf(p);
    const locked = !!mine;

    let summary;
    if (count) {
      summary = `${esc(t("avgWord"))}: <b>${avg.toFixed(1)}</b> · \u2066${count}\u2069 ${esc(t("votes"))}` +
        (mine ? ` · ${esc(t("yourRating"))}: <b>${mine}</b>` : "");
    } else {
      summary = esc(t("noVotes"));
    }

    return `
      <button type="button" class="modal-back" data-close="detailOverlay">${icon("back", 15)}<span>${esc(t("back"))}</span></button>
      <div class="modal-head">
        <h3>${esc(p.title)}</h3>
      </div>
      <span class="tag detail-tag">${esc(subName(p.group, p.subcategory))}</span>
      ${p.description ? `<p class="detail-desc">${esc(p.description)}</p>` : ""}
      <div class="detail-meta">
        ${p.phone ? `<span class="ltr-num">${icon("phone", 16)}${phoneHTML(p.phone)}</span>` : ""}
        ${p.location ? `<span>${icon("pin", 16)}${esc(p.location)}</span>` : ""}
      </div>
      <div class="detail-actions">
        ${tel ? `<a class="btn btn-solid" href="tel:${esc(tel)}">${icon("phone", 14)}${esc(t("call"))}</a>` : ""}
        ${wa ? `<a class="btn btn-outline" href="https://wa.me/${esc(wa)}" target="_blank" rel="noopener">${icon("chat", 14)}WhatsApp</a>` : ""}
        ${state.admin ? `<button type="button" class="btn btn-danger detail-del" data-id="${esc(p.id)}">${icon("trash", 14)}${esc(t("delete"))}</button>` : ""}
      </div>
      <div class="rating-block">
        <div class="rate-label">${esc(t("ratePrompt"))}</div>
        <div class="rate-stars${locked ? " locked" : ""}" id="rateStars">
          ${[1,2,3,4,5].map(v => `<button type="button" data-v="${v}" class="${v <= mine ? "lit" : ""}" aria-label="${v}">${starSVG(v <= mine, 34)}</button>`).join("")}
        </div>
        <div class="rate-summary" id="rateSummary">${summary}</div>
        <div class="rate-err" id="rateErr"></div>
      </div>`;
  }

  function bindDetail(p) {
    const body = $("detailBody");
    const { mine } = ratingOf(p);

    const paint = (upto) => {
      body.querySelectorAll("#rateStars button").forEach(b => {
        const lit = +b.dataset.v <= upto;
        b.classList.toggle("lit", lit);
        b.innerHTML = starSVG(lit, 34);
      });
    };

    body.querySelectorAll("#rateStars button").forEach(btn => {
      const v = +btn.dataset.v;
      if (!mine) {
        btn.addEventListener("mouseenter", () => paint(v));
        btn.addEventListener("click", () => vote(p.id, v));
      }
    });
    const starsEl = body.querySelector("#rateStars");
    if (starsEl) starsEl.addEventListener("mouseleave", () => paint(mine || 0));

    const del = body.querySelector(".detail-del");
    if (del) del.addEventListener("click", () => {
      pendingDeleteId = del.dataset.id;
      const doc0 = state.docs.find(d => d.id === pendingDeleteId);
      $("confirmText").textContent = t("confirmDesc").replace("{title}", doc0 ? doc0.title : "");
      openOv("confirmOverlay");
    });

    const back = body.querySelector("[data-close='detailOverlay']");
    if (back) back.addEventListener("click", () => closeOv("detailOverlay"));
  }

  function renderDetail(id) {
    const p = state.docs.find(d => d.id === id);
    if (!p) { closeOv("detailOverlay"); state.detailId = null; return; }
    const wasOpen = $("detailOverlay").classList.contains("show");
    $("detailBody").innerHTML = detailHTML(p);
    bindDetail(p);
    if (!wasOpen) openOv("detailOverlay");
  }

  function openDetail(id) {
    state.detailId = id;
    renderDetail(id);
  }

  /* ================= Модальные окна ================= */
  const openOv = (id) => $(id).classList.add("show");
  const closeOv = (id) => $(id).classList.remove("show");
  document.querySelectorAll("[data-close]").forEach(b =>
    b.addEventListener("click", () => closeOv(b.dataset.close)));
  ["loginOverlay", "addOverlay", "confirmOverlay", "detailOverlay", "subOverlay"].forEach(id => {
    $(id).addEventListener("click", e => { if (e.target === $(id)) closeOv(id); });
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      ["loginOverlay", "addOverlay", "confirmOverlay", "detailOverlay", "subOverlay"].forEach(id => closeOv(id));
      state.detailId = null;
    }
  });

  /* ================= Подписка ================= */
  let selectedPlan = null;
  $("subBtn").addEventListener("click", () => {
    selectedPlan = null;
    document.querySelectorAll("#subOverlay .plan").forEach(x => x.classList.remove("on"));
    openOv("subOverlay");
  });
  document.querySelectorAll("#subOverlay .plan").forEach(b => {
    b.addEventListener("click", () => {
      selectedPlan = b.dataset.plan;
      document.querySelectorAll("#subOverlay .plan").forEach(x => x.classList.toggle("on", x === b));
    });
  });
  $("subPayBtn").addEventListener("click", () => {
    if (!selectedPlan) { toast(t("subSelectPlan")); return; }
    const planName = t(selectedPlan === "m1" ? "subM1" : selectedPlan === "m3" ? "subM3" : "subY1");
    const price = selectedPlan === "m1" ? "$2.50" : selectedPlan === "m3" ? "$7.00" : "$15.00";
    const msg = encodeURIComponent(
      `${t("subWaMsg")}\n${planName} — ${price}`
    );
    const waNum = WA_SUPPORT.replace(/\D/g, "");
    window.open(`https://wa.me/${waNum}?text=${msg}`, "_blank", "noopener");
  });
  $("subBtn").querySelector(".ic").innerHTML = icon("crown", 15);

  /* ================= Клик по карточке = открытие ================= */
  $("list").addEventListener("click", e => {
    if (e.target.closest("a, button")) return;
    const row = e.target.closest(".row");
    if (row) openDetail(row.dataset.id);
  });

  /* ================= Авторизация ================= */
  function syncAdminUI() {
    $("adminBtn").style.display = state.admin ? "none" : "";
    $("floatLogout").classList.toggle("show", state.admin);
    renderSubs();
    renderList();
  }

  onAuthStateChanged(auth, user => {
    state.admin = !!user;
    syncAdminUI();
  });

  $("adminBtn").addEventListener("click", () => {
    $("loginErr").classList.remove("show");
    $("loginForm").reset();
    openOv("loginOverlay");
    setTimeout(() => { try { $("emailInput").focus(); } catch {} }, 350);
  });

  let loginBusy = false;
  async function doLogin() {
    if (loginBusy) return;
    const em = $("emailInput").value.trim();
    const pw = $("passInput").value.trim();
    if (!em || !pw) { banner($("loginErr"), "fillRequired"); return; }

    const btn = $("loginSubmitBtn");
    loginBusy = true;
    btn.disabled = true;
    btn.textContent = t("loginBusy");

    try {
      await withTimeout(signInWithEmailAndPassword(auth, em, pw), 15000);
      state.admin = true;
      syncAdminUI();
      closeOv("loginOverlay");
      toast(t("toastWelcome"));
    } catch (err) {
      console.error("Auth error:", err && err.code, err && err.message);
      bannerMsg($("loginErr"), authErrText(err && err.code));
    } finally {
      loginBusy = false;
      btn.disabled = false;
      btn.textContent = t("login");
    }
  }

  $("loginSubmitBtn").addEventListener("click", doLogin);
  $("loginForm").addEventListener("submit", e => { e.preventDefault(); doLogin(); });
  $("passInput").addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); doLogin(); }
  });
  $("emailInput").addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); $("passInput").focus(); }
  });

  $("floatLogout").addEventListener("click", async () => {
    try { await signOut(auth); toast(t("toastLoggedOut")); }
    catch (e) { console.error(e); }
  });

  /* ================= Форма добавления карточки ================= */
  function fillCatSelect() {
    $("fCat").innerHTML = CATS.map(c =>
      `<option value="${c.id}"${state.cat === c.id ? " selected" : ""}>${esc(catName(c))}</option>`).join("");
    syncLevelSelect();
  }
  function syncLevelSelect() {
    const cat = catById($("fCat").value);
    if (cat.levels) {
      $("fLevelField").hidden = false;
      $("fLevel").innerHTML = cat.levels.map(l =>
        `<option value="${l.id}"${state.level === l.id ? " selected" : ""}>${esc(levelName(l))}</option>`).join("");
    } else {
      $("fLevelField").hidden = true;
      $("fLevel").innerHTML = "";
    }
    fillSubSelect();
  }
  function fillSubSelect() {
    const cat = catById($("fCat").value);
    const lv = cat.levels
      ? (cat.levels.find(l => l.id === $("fLevel").value) || cat.levels[0])
      : levelsOf(cat)[0];
    $("fSub").innerHTML = lv.subs.map(s =>
      `<option value="${s.id}">${esc(nm(s))}</option>`).join("");
    updateLocLabel();
  }
  function updateLocLabel() {
    const cat = catById($("fCat").value);
    const needsLoc = cat.base === "stores" || cat.base === "services";
    $("fLocLabel").innerHTML = esc(t("fLocation")) + (needsLoc ? ' <span class="req">*</span>' : "");
    $("fTitle").placeholder = t(cat.base === "stores" ? "fTitleStore"
                              : cat.base === "services" ? "fTitleVenue"
                              : "fTitlePerson");
  }
  $("fCat").addEventListener("change", syncLevelSelect);
  $("fLevel").addEventListener("change", fillSubSelect);

  $("fDesc").addEventListener("input", () => {
    const n = $("fDesc").value.length;
    const c = $("descCounter");
    c.textContent = `${n} / 500`;
    c.classList.toggle("over", n > 500);
  });

  function openAddModal() {
    $("addForm").reset();
    $("addErr").classList.remove("show");
    $("descCounter").textContent = "0 / 500";
    $("descCounter").classList.remove("over");
    fillCatSelect();
    openOv("addOverlay");
  }

  $("addForm").addEventListener("submit", async e => {
    e.preventDefault();
    const cat = catById($("fCat").value);
    const groupId = cat.levels ? $("fLevel").value : cat.id;
    const title = $("fTitle").value.trim();
    const phone = $("fPhone").value.trim();
    const location = $("fLoc").value.trim();
    const description = $("fDesc").value.trim();

    if (!title || !phone || !groupId) { banner($("addErr"), "fillRequired"); return; }
    if ((cat.base === "stores" || cat.base === "services") && !location) { banner($("addErr"), "locRequired"); return; }
    if (description.length > 500) { banner($("addErr"), "descLimit"); return; }

    try {
      await dbAdd({
        type: cat.base === "stores" ? "store" : cat.base === "services" ? "service" : "person",
        category: cat.base,
        group: groupId,
        subcategory: $("fSub").value,
        title, phone, location, description
      });
      closeOv("addOverlay");
      toast(t("toastAdded"));
    } catch (err) {
      console.error(err);
      toast("⚠ " + ((err && err.code) || t("loadError")), "err");
    }
  });

  /* ================= Удаление ================= */
  $("list").addEventListener("click", e => {
    const btn = e.target.closest(".row-del");
    if (!btn) return;
    pendingDeleteId = btn.dataset.id;
    const p = state.docs.find(d => d.id === pendingDeleteId);
    $("confirmText").textContent = t("confirmDesc").replace("{title}", p ? p.title : "");
    openOv("confirmOverlay");
  });

  $("confirmDeleteBtn").addEventListener("click", async () => {
    if (!pendingDeleteId) return;
    try {
      await dbRemove(pendingDeleteId);
      toast(t("toastDeleted"));
      if (state.detailId === pendingDeleteId) { closeOv("detailOverlay"); state.detailId = null; }
    } catch (err) {
      console.error(err);
      toast("⚠ " + ((err && err.code) || t("loadError")), "err");
    }
    pendingDeleteId = null;
    closeOv("confirmOverlay");
  });

  /* ================= Навигация ================= */
  $("cats").addEventListener("click", e => {
    const b = e.target.closest(".cat-pill");
    if (!b) return;
    state.cat = b.dataset.cat;
    const cat = catById(state.cat);
    state.level = levelsOf(cat)[0].id;
    state.sub = "all";
    state.levelSelected = !cat.levels;
    renderCats(); renderSubs(); renderList();
  });

  $("subs").addEventListener("click", e => {
    const subcard = e.target.closest("[data-subcard]");
    if (subcard) { state.sub = subcard.dataset.subcard; renderSubs(); renderList(); return; }
    const lvl = e.target.closest("[data-level]");
    if (lvl) {
      state.level = lvl.dataset.level;
      state.sub = "all";
      state.levelSelected = true;
      renderSubs(); renderList();
      return;
    }
    const chip = e.target.closest(".chip");
    if (chip) { state.sub = chip.dataset.sub; renderSubs(); renderList(); return; }
    if (e.target.closest("#addCardBtn")) openAddModal();
  });

  $("searchInput").addEventListener("input", e => {
    state.search = e.target.value.trim();
    $("searchBox").classList.toggle("live", !!state.search);
    renderList();
  });

  $("langRu").addEventListener("click", () => setLang("ru"));
  $("langAr").addEventListener("click", () => setLang("ar"));
  $("langEn").addEventListener("click", () => setLang("en"));
  function setLang(l) {
    if (state.lang === l) return;
    state.lang = l;
    store.set("rakka_lang", l);
    applyLang();
  }

  /* ============ Скролл-анимации и параллакс ============ */
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => { if (en.isIntersecting) en.target.classList.add("vis"); });
  }, { threshold: .12 });
  document.querySelectorAll(".reveal").forEach(el => io.observe(el));

  const moonEl = $("moon");
  window.addEventListener("scroll", () => {
    moonEl.style.marginTop = (window.scrollY * -0.18) + "px";
  }, { passive: true });

  /* ================= Инициализация ================= */
  (async function init() {
    try {
      $("adminBtn").querySelector(".ic").innerHTML = icon("lock", 15);
      $("searchIcon").innerHTML = icon("search", 18);
      $("logoutIcon").innerHTML = icon("logout", 16);
      document.querySelectorAll(".modal-close").forEach(b => b.innerHTML = icon("x", 18));

      state.levelSelected = !catById(state.cat).levels;
      applyLang();
      renderAll();
      startListener();
    } catch (e) {
      console.error(e);
      toast("⚠ " + (e.message || "خطأ في التهيئة"), "err");
    }
  })();
</script>
</body>
</html>
